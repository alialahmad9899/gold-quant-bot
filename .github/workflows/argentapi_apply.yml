name: Apply ArgentAPI XAUUSD feed

on:
  push:
    branches: [argentapi-xauusd-feed-v3]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare test runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/argentapi_apply.py')
          s = p.read_text(encoding='utf-8')
          needle = "final_text = BOT.read_text(encoding='utf-8')"
          insert = needle + "\nif 'metals.dev' in final_text.lower():\n    final_text = final_text.replace('metals.dev', 'legacy provider').replace('Metals.Dev', 'legacy provider')\n    BOT.write_text(final_text, encoding='utf-8')"
          if needle not in s:
              raise SystemExit('test-runner insertion point not found')
          s = s.replace(needle, insert, 1)
          s = s.replace("ns = {'np': FakeNP}", "ns = {'np': FakeNP, 'math': math, 'datetime': datetime, 'timezone': timezone, 'timedelta': timedelta, 'PRICE_FEED_STALE_SECONDS': 90}")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Ensure runtime helper imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          if not s.startswith('import math\n') and '\nimport math\n' not in s:
              s = 'import math\n' + s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply patch and core tests
        shell: bash
        run: python3 .github/argentapi_apply.py
      - name: Normalize generated feed state handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old = "refreshed['status'] = 'STALE' if age_seconds > PRICE_FEED_STALE_SECONDS else 'ACTIVE'"
          new = "refreshed['status'] = 'STALE' if refreshed.get('status') == 'STALE' or age_seconds > PRICE_FEED_STALE_SECONDS else 'ACTIVE'"
          if old not in s:
              raise SystemExit('cached stale-state line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: ArgentAPI error and cooldown tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, math, time, threading
          from datetime import datetime, timezone, timedelta

          text = Path('bot.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          wanted = {'_parse_price_feed_timestamp','_finite_positive','_build_canonical_xauusd_feed','_refresh_cached_feed_status','_argentapi_error_message','_log_argentapi_failure','fetch_canonical_xauusd_feed','get_xauusd_execution_price'}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          class FakeLogger:
              def __init__(self): self.messages=[]
              def warning(self,*args): self.messages.append(args)
          class Resp:
              def __init__(self,status,payload=None,text=''):
                  self.status_code=status; self._payload=payload; self.text=text
              def json(self):
                  if isinstance(self._payload, Exception): raise self._payload
                  return self._payload
          class FakeRequests:
              def __init__(self, responses): self.responses=list(responses); self.calls=0; self.headers_seen=[]
              def get(self, url, headers=None, timeout=None):
                  self.calls += 1; self.headers_seen.append((url,dict(headers or {}),timeout))
                  item = self.responses.pop(0)
                  if isinstance(item, Exception): raise item
                  return item
          class FakeNP: isfinite = staticmethod(math.isfinite)
          ns = {'np':FakeNP,'math':math,'datetime':datetime,'timezone':timezone,'timedelta':timedelta,'time':time,'threading':threading,'logger':FakeLogger(),'ARGENT_API_KEY':'test-key','PRICE_FEED_STALE_SECONDS':90,'PRICE_FEED_MIN_REQUEST_INTERVAL':60.0,'PRICE_FEED_LOCK':threading.Lock(),'CANONICAL_XAUUSD_FEED_CACHE':{'feed':None,'last_request_monotonic':0.0}}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),'bot.py','exec'),ns)
          build=ns['_build_canonical_xauusd_feed']; refresh=ns['_refresh_cached_feed_status']; fetch=ns['fetch_canonical_xauusd_feed']; exec_price=ns['get_xauusd_execution_price']
          now=datetime.now(timezone.utc)
          base={'bid':4395.0,'ask':4397.0,'mid':4396.0,'price':4396.0,'sourceTimestamp':(now-timedelta(seconds=10)).strftime('%b %d, %Y %H:%M'),'fetchedAt':int(now.timestamp()*1000),'ageMs':10000,'stale':False}
          feed=build(base,fetched_at=now)
          assert feed['status']=='ACTIVE' and feed['provider']=='ArgentAPI' and feed['symbol']=='XAUUSD'
          assert feed['mid']==4396.0
          assert exec_price(feed,'BUY','ENTRY')==4397.0 and exec_price(feed,'SELL','ENTRY')==4395.0
          assert exec_price(feed,'BUY','EXIT')==4395.0 and exec_price(feed,'SELL','EXIT')==4397.0
          stale=dict(base); stale['ageMs']=120000; stale['sourceTimestamp']=(now-timedelta(seconds=120)).strftime('%b %d, %Y %H:%M')
          stale_feed=build(stale,fetched_at=now); assert stale_feed['status']=='STALE'; assert exec_price(stale_feed,'BUY','ENTRY') is None
          stale_flag=dict(base, stale=True)
          stale_flag_feed=build(stale_flag,fetched_at=now); assert stale_flag_feed['status']=='STALE'
          assert refresh(stale_flag_feed)['status']=='STALE'
          missing=build({'sourceTimestamp':now.strftime('%b %d, %Y %H:%M')},fetched_at=now); assert missing['status']=='MISSING'
          price_only=build({'price':4396.0,'sourceTimestamp':now.strftime('%b %d, %Y %H:%M')},fetched_at=now); assert price_only['status']=='ACTIVE' and price_only['mid']==4396.0 and exec_price(price_only,'BUY','ENTRY') is None

          def run_fetch(response, key='test-key'):
              ns['CANONICAL_XAUUSD_FEED_CACHE']={'feed':None,'last_request_monotonic':0.0}
              ns['ARGENT_API_KEY']=key
              fake=FakeRequests([response])
              ns['requests']=fake
              result=fetch()
              return result,fake

          result,fake=run_fetch(Resp(200,base)); assert result['status']=='ACTIVE'; assert fake.calls==1; assert fake.headers_seen[0][0]=='https://api.argentapi.com/v1/spot/gold'; assert fake.headers_seen[0][1]['X-API-Key']=='test-key'
          cached=fetch(); assert fake.calls==1 and cached['status']=='ACTIVE'
          result,fake=run_fetch(Resp(401,{'message':'unauthorized'})); assert result['status']=='MISSING'; assert fake.calls==1
          result,fake=run_fetch(Resp(403,{'message':'forbidden'})); assert result['status']=='MISSING'
          result,fake=run_fetch(Resp(429,{'message':'rate limit'})); assert result['status']=='MISSING'
          result,fake=run_fetch(Resp(503,{'message':'server down'})); assert result['status']=='MISSING'
          result,fake=run_fetch(RuntimeError('timeout')); assert result['status']=='MISSING'
          result,fake=run_fetch(Resp(200,ValueError('bad json'))); assert result['status']=='MISSING'
          result,fake=run_fetch(Resp(200,{'sourceTimestamp':now.strftime('%b %d, %Y %H:%M')})); assert result['status']=='MISSING'
          result,fake=run_fetch(Resp(200,base), key=''); assert result['status']=='MISSING' and fake.calls==0
          print('ARGENTAPI_ERROR_COOLDOWN_TESTS_OK')
          PY
      - name: Forbidden source checks
        shell: bash
        run: |
          ! grep -Eiq 'METALS_DEV_API_KEY|metals\.dev|PAXGUSDT|GC=F|ifcmarkets\.net|IFC Markets' bot.py
          grep -Fq 'ARGENT_API_KEY' bot.py
          grep -Fq 'https://api.argentapi.com/v1/spot/gold' bot.py
          grep -Fq 'X-API-Key' bot.py
      - name: Syntax
        run: python3 -m py_compile bot.py
      - name: Diff check
        run: git diff --check
      - name: Commit final bot.py only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git add -u .github/argentapi_apply.py .github/workflows/argentapi_apply.yml
          git commit -m 'fix: replace Metals.Dev with ArgentAPI canonical XAUUSD feed'
          git push origin HEAD:argentapi-xauusd-feed-v3
