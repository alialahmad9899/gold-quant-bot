name: yahoo-access-hardening-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Yahoo access architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast, re

          bot = Path('bot.py')
          s = bot.read_text(encoding='utf-8')

          # Remove yfinance completely: it is the same Yahoo backend and was
          # creating a second request path after direct Yahoo failures.
          s = re.sub(r'^import yfinance as yf\n', '', s, flags=re.M)

          # Make cooldowns real protection rather than rapid retry loops.
          s = re.sub(r"YAHOO_LIVE_COOLDOWN_SECONDS\s*=.*", "YAHOO_LIVE_COOLDOWN_SECONDS = int(os.getenv('YAHOO_LIVE_COOLDOWN_SECONDS', '60'))", s, count=1)
          s = re.sub(r"YAHOO_HISTORICAL_COOLDOWN_SECONDS\s*=.*", "YAHOO_HISTORICAL_COOLDOWN_SECONDS = int(os.getenv('YAHOO_HISTORICAL_COOLDOWN_SECONDS', '300'))", s, count=1)
          s = re.sub(r"YAHOO_HISTORICAL_FETCH_INTERVAL_SECONDS\s*=.*", "YAHOO_HISTORICAL_FETCH_INTERVAL_SECONDS = int(os.getenv('YAHOO_HISTORICAL_FETCH_INTERVAL_SECONDS', '300'))", s, count=1)
          marker = "YAHOO_HISTORICAL_STATE_LOCK = threading.Lock()"
          locks = marker + "\nYAHOO_LIVE_REQUEST_LOCK = threading.Lock()\nYAHOO_HISTORICAL_REQUEST_LOCK = threading.Lock()\nYAHOO_HIST_CACHE = {}\nYAHOO_HTTP_DIAGNOSTIC = {'status': None, 'host': None, 'transport': None, 'error_type': None, 'message': None}\n"
          if 'YAHOO_LIVE_REQUEST_LOCK' not in s:
              if marker not in s:
                  raise SystemExit('Yahoo state marker not found')
              s = s.replace(marker, locks, 1)

          def replace_func(src: str, name: str, replacement: str) -> str:
              m = re.search(rf'^def {re.escape(name)}\(.*?(?=^def |\Z)', src, flags=re.M|re.S)
              if not m:
                  raise SystemExit(f'missing function: {name}')
              return src[:m.start()] + replacement.rstrip() + "\n\n" + src[m.end():]

          new_http = r'''def http_get_yahoo(url, timeout=8):
    """Single Yahoo JSON request path with explicit diagnostics and no rapid transport fan-out."""
    global YAHOO_HTTP_DIAGNOSTIC
    parsed_hosts = ('query1.finance.yahoo.com', 'query2.finance.yahoo.com')
    last_status = None
    last_error = None

    for host in parsed_hosts:
        target = url.replace('query1.finance.yahoo.com', host).replace('query2.finance.yahoo.com', host)
        if HAS_CURL_CFFI:
            try:
                r = curl_requests.get(target, impersonate='chrome124', timeout=timeout, verify=True)
                status = int(getattr(r, 'status_code', 0) or 0)
                YAHOO_HTTP_DIAGNOSTIC = {'status': status, 'host': host, 'transport': 'curl_cffi', 'error_type': None, 'message': None}
                if status == 200:
                    try:
                        data = r.json()
                        result = (data.get('chart') or {}).get('result') if isinstance(data, dict) else None
                        if result:
                            return data
                        YAHOO_HTTP_DIAGNOSTIC['error_type'] = 'missing_result'
                        YAHOO_HTTP_DIAGNOSTIC['message'] = 'Yahoo response has no chart.result.'
                        return None
                    except Exception as exc:
                        YAHOO_HTTP_DIAGNOSTIC['error_type'] = 'invalid_json'
                        YAHOO_HTTP_DIAGNOSTIC['message'] = str(exc)[:250]
                        return None
                last_status = status
                if status in (403, 404, 429) or status >= 500:
                    YAHOO_HTTP_DIAGNOSTIC['error_type'] = f'http_{status}'
                    YAHOO_HTTP_DIAGNOSTIC['message'] = str(getattr(r, 'text', '') or '')[:250]
                    if status in (403, 429):
                        return None
                    if status == 404:
                        return None
                    # one alternate host only for transient 5xx
                    continue
            except Exception as exc:
                last_error = exc
                YAHOO_HTTP_DIAGNOSTIC = {'status': None, 'host': host, 'transport': 'curl_cffi', 'error_type': type(exc).__name__, 'message': str(exc)[:250]}
                if isinstance(exc, TimeoutError) or 'timeout' in str(exc).lower():
                    continue
                continue
        else:
            try:
                r = requests.get(target, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'}, timeout=timeout)
                status = int(getattr(r, 'status_code', 0) or 0)
                YAHOO_HTTP_DIAGNOSTIC = {'status': status, 'host': host, 'transport': 'requests', 'error_type': None, 'message': None}
                if status == 200:
                    try:
                        data = r.json()
                        result = (data.get('chart') or {}).get('result') if isinstance(data, dict) else None
                        if result:
                            return data
                        YAHOO_HTTP_DIAGNOSTIC['error_type'] = 'missing_result'
                        YAHOO_HTTP_DIAGNOSTIC['message'] = 'Yahoo response has no chart.result.'
                        return None
                    except Exception as exc:
                        YAHOO_HTTP_DIAGNOSTIC['error_type'] = 'invalid_json'
                        YAHOO_HTTP_DIAGNOSTIC['message'] = str(exc)[:250]
                        return None
                last_status = status
                if status in (403, 404, 429) or status >= 500:
                    YAHOO_HTTP_DIAGNOSTIC['error_type'] = f'http_{status}'
                    YAHOO_HTTP_DIAGNOSTIC['message'] = str(getattr(r, 'text', '') or '')[:250]
                    if status in (403, 429, 404):
                        return None
            except Exception as exc:
                last_error = exc
                YAHOO_HTTP_DIAGNOSTIC = {'status': None, 'host': host, 'transport': 'requests', 'error_type': type(exc).__name__, 'message': str(exc)[:250]}
                continue

    if YAHOO_HTTP_DIAGNOSTIC.get('error_type') is None:
        YAHOO_HTTP_DIAGNOSTIC = {'status': last_status, 'host': YAHOO_HTTP_DIAGNOSTIC.get('host'), 'transport': YAHOO_HTTP_DIAGNOSTIC.get('transport'), 'error_type': type(last_error).__name__ if last_error else 'network_error', 'message': str(last_error)[:250] if last_error else 'Yahoo request failed.'}
    return None
'''

          new_hist = r'''def fetch_yahoo_direct(symbol, range_str='10d', interval_str='15m'):
    """Fetch historical OHLC directly from Yahoo with centralized per-key caching."""
    key = (str(symbol), str(interval_str), str(range_str))
    now = time.monotonic()
    cached = YAHOO_HIST_CACHE.get(key)
    ttl = YAHOO_HISTORICAL_FETCH_INTERVAL_SECONDS if symbol == 'XAUUSD=X' else 300
    if cached and now < cached.get('blocked_until', 0.0):
        return cached.get('df', pd.DataFrame()).copy()
    if cached and now - cached.get('last_success', 0.0) < ttl:
        return cached.get('df', pd.DataFrame()).copy()

    with YAHOO_HISTORICAL_REQUEST_LOCK:
        now = time.monotonic()
        cached = YAHOO_HIST_CACHE.get(key)
        if cached and now < cached.get('blocked_until', 0.0):
            return cached.get('df', pd.DataFrame()).copy()
        if cached and now - cached.get('last_success', 0.0) < ttl:
            return cached.get('df', pd.DataFrame()).copy()

        url = f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval={interval_str}&range={range_str}'
        data = http_get_yahoo(url, timeout=8)
        if not data:
            diag = dict(YAHOO_HTTP_DIAGNOSTIC)
            status = diag.get('status')
            cooldown = YAHOO_HISTORICAL_COOLDOWN_SECONDS
            if status in (403, 429):
                cooldown = max(cooldown, 900)
            elif status is not None and status >= 500:
                cooldown = max(cooldown, 120)
            msg = diag.get('message') or 'Yahoo historical request failed.'
            kind = diag.get('error_type') or 'network_error'
            logger.warning('[MARKET_DATA] Yahoo historical cooldown type=%s http_status=%s seconds=%s message=%s', kind, status, cooldown, msg)
            YAHOO_HIST_CACHE[key] = {'df': cached.get('df', pd.DataFrame()).copy() if cached else pd.DataFrame(), 'last_success': cached.get('last_success', 0.0) if cached else 0.0, 'blocked_until': now + cooldown}
            return YAHOO_HIST_CACHE[key]['df'].copy()

        try:
            result = ((data.get('chart') or {}).get('result') or [None])[0]
            if not result:
                raise ValueError('Yahoo response has no chart.result')
            timestamps = result.get('timestamp') or []
            quote = ((result.get('indicators') or {}).get('quote') or [None])[0]
            if not timestamps or not quote:
                raise ValueError('Yahoo response has no OHLC payload')
            df = pd.DataFrame({
                'Open': quote.get('open', []),
                'High': quote.get('high', []),
                'Low': quote.get('low', []),
                'Close': quote.get('close', []),
                'Volume': quote.get('volume', [0] * len(timestamps)),
            }, index=pd.to_datetime(timestamps, unit='s', utc=True)).dropna(subset=['Open','High','Low','Close'])
            if df.empty:
                raise ValueError('Yahoo OHLC frame is empty')
            YAHOO_HIST_CACHE[key] = {'df': df.copy(), 'last_success': now, 'blocked_until': 0.0}
            with YAHOO_HISTORICAL_STATE_LOCK:
                YAHOO_HISTORICAL_FEED_STATE['blocked_until'] = 0.0
                YAHOO_HISTORICAL_FEED_STATE['error_type'] = None
                YAHOO_HISTORICAL_FEED_STATE['error_message'] = None
            return df
        except Exception as exc:
            msg = f'{type(exc).__name__}: {exc}'[:300]
            logger.warning('[MARKET_DATA] Yahoo historical parse failure type=%s message=%s', type(exc).__name__, msg)
            YAHOO_HIST_CACHE[key] = {'df': pd.DataFrame(), 'last_success': 0.0, 'blocked_until': now + YAHOO_HISTORICAL_COOLDOWN_SECONDS}
            return pd.DataFrame()
'''

          new_live = r'''def fetch_canonical_xauusd_feed():
    """Canonical XAU/USD Spot from Yahoo XAUUSD=X with centralized 60s request gate."""
    now = time.monotonic()
    with YAHOO_LIVE_REQUEST_LOCK:
        cached = CANONICAL_XAUUSD_FEED_CACHE.get('feed')
        last_attempt = float(CANONICAL_XAUUSD_FEED_CACHE.get('last_request_monotonic', 0.0) or 0.0)
        blocked_until = float(CANONICAL_XAUUSD_FEED_CACHE.get('blocked_until', 0.0) or 0.0)
        if now < blocked_until:
            return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('cooldown', 'Yahoo live request cooldown is active.')
        if now - last_attempt < 60.0:
            return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('rate_gate', 'Yahoo live request gate is active.')
        CANONICAL_XAUUSD_FEED_CACHE['last_request_monotonic'] = now

        payload = http_get_yahoo('https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X?interval=1m&range=1d', timeout=8)
        if not payload:
            diag = dict(YAHOO_HTTP_DIAGNOSTIC)
            status = diag.get('status')
            cooldown = 60
            if status in (403, 429):
                cooldown = 900
            elif status is not None and status >= 500:
                cooldown = 120
            msg = diag.get('message') or 'Yahoo XAUUSD=X live quote request failed.'
            kind = diag.get('error_type') or 'network_error'
            CANONICAL_XAUUSD_FEED_CACHE['blocked_until'] = time.monotonic() + cooldown
            feed = _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed(kind, msg)
            if cached:
                feed = dict(feed)
                feed['status'] = 'STALE'
                feed['error_type'] = kind
                feed['error_message'] = msg
            CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
            logger.warning('[XAUUSD_FEED] Yahoo Spot cooldown type=%s http_status=%s seconds=%s message=%s', kind, status, cooldown, msg)
            logger.warning('[XAUUSD_FEED] Yahoo Spot failure type=%s http_status=%s message=%s', kind, status, msg)
            return feed

        result = ((payload.get('chart') or {}).get('result') or [None])[0]
        meta = (result or {}).get('meta') or {}
        price = meta.get('regularMarketPrice')
        try:
            price = float(price)
        except (TypeError, ValueError):
            price = None
        if price is None or price <= 1000:
            msg = 'Yahoo XAUUSD=X live payload did not contain a valid regularMarketPrice.'
            CANONICAL_XAUUSD_FEED_CACHE['blocked_until'] = time.monotonic() + 60
            feed = _build_missing_yahoo_feed('missing_price', msg)
            CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
            logger.warning('[XAUUSD_FEED] Yahoo Spot failure type=missing_price message=%s', msg)
            return feed

        bid = meta.get('bid')
        ask = meta.get('ask')
        try:
            bid = float(bid) if bid is not None else None
        except (TypeError, ValueError):
            bid = None
        try:
            ask = float(ask) if ask is not None else None
        except (TypeError, ValueError):
            ask = None
        mid = ((bid + ask) / 2.0) if bid and ask and bid > 0 and ask > 0 else price
        ts = meta.get('regularMarketTime')
        source_dt = datetime.fromtimestamp(int(ts), tz=timezone.utc) if ts else datetime.now(timezone.utc)
        age = max(0.0, (datetime.now(timezone.utc) - source_dt).total_seconds())
        feed = {
            'symbol': 'XAUUSD=X', 'provider': 'Yahoo Finance',
            'status': 'ACTIVE' if age <= PRICE_FEED_STALE_SECONDS else 'STALE',
            'bid': bid, 'ask': ask, 'mid': round(float(mid), 6), 'spot': round(float(price), 6),
            'timestamp': source_dt.isoformat(), 'fetched_timestamp': datetime.now(timezone.utc).isoformat(),
            'age_seconds': round(age, 3), 'error_type': None, 'error_message': None,
            'spread_available': bool(bid and ask),
        }
        CANONICAL_XAUUSD_FEED_CACHE['blocked_until'] = 0.0
        CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
        return feed
'''

          # Current file contains these functions in the Yahoo path. Replace them without touching unrelated strategy/ML code.
          for name, replacement in [('http_get_yahoo', new_http), ('fetch_yahoo_direct', new_hist), ('fetch_canonical_xauusd_feed', new_live)]:
              s = replace_func(s, name, replacement)

          live = r'''def fetch_live_spot_gold():
    """Return cached/live XAU/USD Spot without historical or secondary-provider fallback."""
    feed = fetch_canonical_xauusd_feed()
    return float(feed.get('mid')) if feed.get('status') == 'ACTIVE' and feed.get('mid') else 0.0
'''
          s = replace_func(s, 'fetch_live_spot_gold', live)

          # Ensure the canonical cache has a blocked_until field even if the prior version omitted it.
          s = re.sub(r"CANONICAL_XAUUSD_FEED_CACHE\s*=\s*\{[^\n]*\}", "CANONICAL_XAUUSD_FEED_CACHE = {'feed': None, 'last_request_monotonic': 0.0, 'blocked_until': 0.0}", s, count=1)

          ast.parse(s)
          bot.write_text(s, encoding='utf-8')

          req = Path('requirements.txt')
          if req.exists():
              reqs = [line for line in req.read_text(encoding='utf-8').splitlines() if line.strip().lower() != 'yfinance']
              req.write_text('\n'.join(reqs).rstrip() + '\n', encoding='utf-8')
          print('PATCH_OK')
          PY

      - name: Verify architecture and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bot.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import ast, re
          t = Path('bot.py').read_text(encoding='utf-8')
          r = Path('requirements.txt').read_text(encoding='utf-8')
          ast.parse(t)
          assert 'import yfinance as yf' not in t
          assert re.search(r'^\s*yfinance\s*$', r, flags=re.M) is None
          assert "YAHOO_LIVE_COOLDOWN_SECONDS = int(os.getenv('YAHOO_LIVE_COOLDOWN_SECONDS', '60'))" in t
          assert "YAHOO_HISTORICAL_COOLDOWN_SECONDS = int(os.getenv('YAHOO_HISTORICAL_COOLDOWN_SECONDS', '300'))" in t
          assert 'YAHOO_LIVE_REQUEST_LOCK = threading.Lock()' in t
          assert 'YAHOO_HISTORICAL_REQUEST_LOCK = threading.Lock()' in t
          assert "XAUUSD=X?interval=1m&range=1d" in t
          assert 'GC=F' not in t
          assert 'PAXGUSDT' not in t
          assert 'ifcmarkets' not in t.lower()
          assert 'api.argentapi.com' not in t.lower()
          assert 'yahoo' in t.lower()
          assert 'YAHOO_HTTP_DIAGNOSTIC' in t
          print('YAHOO_ACCESS_HARDENING_OK')
          PY

      - name: Commit production changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py requirements.txt .github/workflows/yahoo_access_hardening_once.yml
          git commit -m "fix: centralize Yahoo access and stop rate-limit retries"
          git push origin main
          git rm -f .github/workflows/yahoo_access_hardening_once.yml
          git commit -m "chore: remove one-time Yahoo hardening workflow"
          git push origin main
