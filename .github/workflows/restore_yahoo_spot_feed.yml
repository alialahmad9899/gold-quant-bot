name: Restore Yahoo XAUUSD Spot
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'stage Yahoo XAUUSD spot restoration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 .github/restore_yahoo_spot_feed_v2.py
