name: Restore Yahoo XAUUSD Spot
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'stage Yahoo XAUUSD spot restoration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 .github/restore_yahoo_spot_feed.py
          git diff --check
          python3 -m py_compile bot.py
          git diff -- bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --check
          git rm -f .github/restore_yahoo_spot_feed.py .github/workflows/restore_yahoo_spot_feed.yml
          git diff --cached --check
          git commit -m 'fix: restore Yahoo XAUUSD spot feed'
          git push origin HEAD:main
