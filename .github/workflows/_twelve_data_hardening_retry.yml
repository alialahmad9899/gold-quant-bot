name: Twelve Data hardening retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor == 'alialahmad9899' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, test and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path('.')
          bot = root / 'bot.py'
          text = bot.read_text(encoding='utf-8')

