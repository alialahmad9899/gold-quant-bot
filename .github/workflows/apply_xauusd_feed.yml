name: Apply canonical XAUUSD price feed

on:
  push:
    branches:
      - phase1-xauusd-canonical-feed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_xauusd_feed.py
      - name: Syntax
        run: python3 -m py_compile bot.py
      - name: Diff check
        run: git diff --check
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/apply_xauusd_feed.py .github/workflows/apply_xauusd_feed.yml
          git diff --cached --stat
          git commit -m "fix: unify canonical XAUUSD price feed"
          git push origin phase1-xauusd-canonical-feed
