name: Codex market feed fixer
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 .github/codex_market_feed_fix.py
          git diff --check
          git diff -- bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py .github/codex_market_feed_fix.py .github/workflows/codex_market_feed_fix.yml
          git diff --cached --check
          git rm .github/codex_market_feed_fix.py .github/workflows/codex_market_feed_fix.yml
          git diff --cached --check
          git commit -m 'fix: harden XAUUSD live feed and Yahoo cooldown'
          git push origin HEAD:main
# trigger Codex market feed repair
