name: Phase 1 lifecycle patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  phase1:
    if: contains(github.event.head_commit.message, 'chore: run Phase 1 lifecycle patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch bot.py
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')

          def replace_def(src, name, replacement):
              tree = ast.parse(src)
              node = next(n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name)
              start = node.lineno - 1
              end = node.end_lineno
              lines = src.splitlines(True)
              return ''.join(lines[:start] + [replacement.rstrip() + '\n'] + lines[end:])

          lifecycle = r'''
          def validate_trade_levels(signal_type, entry, sl, tp1, tp2):
              """Strict Phase 1 validation for direction-aware Entry/SL/TP levels."""
              direction = str(signal_type).upper()
              if 'BUY' in direction or 'شراء' in direction:
                  side = 'BUY'
              elif 'SELL' in direction or 'بيع' in direction:
                  side = 'SELL'
              else:
                  raise ValueError(f'Invalid trade direction: {signal_type}')

              values = {'entry': entry, 'sl': sl, 'tp1': tp1, 'tp2': tp2}
              for name, value in values.items():
                  try:
                      value = float(value)
                  except (TypeError, ValueError):
                      raise ValueError(f'{name} must be numeric') from None
                  if not np.isfinite(value) or value <= 0:
                      raise ValueError(f'{name} must be a positive finite price')

              entry, sl, tp1, tp2 = map(float, (entry, sl, tp1, tp2))
              if side == 'BUY':
                  valid = sl < entry < tp1 < tp2
              else:
                  valid = tp2 < tp1 < entry < sl
              if not valid:
                  raise ValueError(
                      f'Invalid {side} lifecycle levels: entry={entry}, sl={sl}, tp1={tp1}, tp2={tp2}'
                  )
              return True

          def calculate_realized_r(signal_type, entry, sl, exit_price):
              """Calculate final R from the original risk distance, never from TP1."""
              validate_trade_levels(signal_type, entry, sl, exit_price, exit_price)
              entry = float(entry); sl = float(sl); exit_price = float(exit_price)
              direction = 'BUY' if ('BUY' in str(signal_type).upper() or 'شراء' in str(signal_type)) else 'SELL'
              risk = abs(entry - sl)
              if risk <= 0:
                  raise ValueError('Initial risk distance must be positive')
              return (exit_price - entry) / risk if direction == 'BUY' else (entry - exit_price) / risk

          def evaluate_trade_bar(signal_type, status, entry, sl, tp1, tp2, open_price, high_price, low_price):
              """Shared lifecycle evaluator used by live ticks and historical M15 bars."""
              validate_trade_levels(signal_type, entry, sl, tp1, tp2)
              direction = 'BUY' if ('BUY' in str(signal_type).upper() or 'شراء' in str(signal_type)) else 'SELL'
              status = status if status in {'OPEN', 'TP1_HIT'} else 'OPEN'
              open_price = float(open_price); high_price = float(high_price); low_price = float(low_price)
              if not (np.isfinite(open_price) and np.isfinite(high_price) and np.isfinite(low_price)):
                  return []
              events = []

              if direction == 'BUY':
                  hit_sl = low_price <= sl
                  hit_tp1 = high_price >= tp1
                  hit_tp2 = high_price >= tp2
              else:
                  hit_sl = high_price >= sl
                  hit_tp1 = low_price <= tp1
                  hit_tp2 = low_price <= tp2

              if status == 'OPEN' and hit_tp1:
                  events.append('TP1_HIT')
                  status = 'TP1_HIT'

              if status in {'OPEN', 'TP1_HIT'}:
                  if hit_sl and hit_tp2:
                      # Intrabar ordering is unknowable; use distance from bar open as the conservative tie-break.
                      final = 'SL_HIT' if abs(open_price - sl) <= abs(open_price - tp2) else 'TP2_HIT'
                  elif hit_sl:
                      final = 'SL_HIT'
                  elif hit_tp2:
                      final = 'TP2_HIT'
                  else:
                      final = None
                  if final:
                      events.append(final)
              return events
          '''
          lifecycle = '\n'.join(line[10:] if line.startswith('          ') else line for line in lifecycle.splitlines())

          anchor = "def log_trade(signal_type, entry, sl, tp1, tp2, rsi, dxy_corr, macd_diff, stoch_k, volatility_ratio, confidence, candle_id=None, signal_score=None, ai_score=None):"
          if 'def validate_trade_levels(' not in text:
              text = text.replace(anchor, lifecycle + '\n\n' + anchor, 1)

          new_log_trade = r'''
          def log_trade(signal_type, entry, sl, tp1, tp2, rsi, dxy_corr, macd_diff, stoch_k, volatility_ratio, confidence, candle_id=None, signal_score=None, ai_score=None):
              validate_trade_levels(signal_type, entry, sl, tp1, tp2)
              conn = get_db_connection()
              try:
                  cursor = conn.cursor()
                  f_entry, f_sl, f_tp1, f_tp2 = map(float, (entry, sl, tp1, tp2))
                  f_rsi, f_dxy, f_macd, f_stoch, f_vol, f_conf = map(float, (rsi, dxy_corr, macd_diff, stoch_k, volatility_ratio, confidence))
                  candle_id = candle_id or datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S')
                  now_str = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
                  is_pg = is_postgres() and isinstance(conn, psycopg2.extensions.connection)
                  params = (now_str, signal_type, f_entry, f_sl, f_tp1, f_tp2, f_rsi, f_dxy, f_macd, f_stoch, f_vol, f_conf, candle_id, FEATURE_VERSION, STRATEGY_VERSION, MODEL_VERSION, signal_score, ai_score)
                  if is_pg:
                      cursor.execute('''
                          INSERT INTO trades
                          (timestamp, signal_type, entry_price, sl, tp1, tp2, rsi, dxy_corr, macd_diff,
                           stoch_k, volatility_ratio, outcome, confidence, candle_id, trade_status,
                           feature_version, strategy_version, model_version, signal_score, ai_score, slippage)
                          VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,NULL,%s,%s,'OPEN',%s,%s,%s,%s,%s,NULL)
                          ON CONFLICT (candle_id) DO NOTHING RETURNING id
                      ''', params)
                  else:
                      cursor.execute('''
                          INSERT OR IGNORE INTO trades
                          (timestamp, signal_type, entry_price, sl, tp1, tp2, rsi, dxy_corr, macd_diff,
                           stoch_k, volatility_ratio, outcome, confidence, candle_id, trade_status,
                           feature_version, strategy_version, model_version, signal_score, ai_score, slippage)
                          VALUES (?,?,?,?,?,?,?,?,?,?,?,NULL,?,?, 'OPEN',?,?,?,?,?,NULL)
                      ''', params)
                  inserted = cursor.rowcount == 1
                  trade_id = None
                  if inserted:
                      if is_pg:
                          row = cursor.fetchone(); trade_id = row[0] if row else None
                      else:
                          trade_id = cursor.lastrowid
                  conn.commit()
                  return inserted, trade_id
              except Exception as e:
                  try: conn.rollback()
                  except Exception: pass
                  system_monitor.record_error('TRADE_INSERT', e)
                  raise
              finally:
                  release_db_connection(conn)
          '''
          text = replace_def(text, 'log_trade', new_log_trade)

          new_update_trade_state = r'''
          def update_trade_state(trade_id, new_status, exit_price=None, realized_r=None, slippage=None):
              """Persist lifecycle milestones; only TP2/SL are final outcomes and create learning."""
              if new_status not in {'TP1_HIT', 'TP2_HIT', 'SL_HIT'}:
                  raise ValueError(f'Unsupported lifecycle status: {new_status}')
              if new_status == 'TP1_HIT':
                  exit_price = None
                  realized_r = None
                  slippage = None
              elif slippage is not None:
                  # Phase 1 explicitly stores no inferred slippage.
                  slippage = None

              conn = get_db_connection()
              changed = False
              try:
                  cur = conn.cursor(); is_pg=is_postgres() and isinstance(conn, psycopg2.extensions.connection); ph='%s' if is_pg else '?'
                  now=datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
                  if new_status=='TP1_HIT':
                      sql=f"UPDATE trades SET trade_status={ph},tp1_hit_at={ph},slippage=NULL WHERE id={ph} AND trade_status='OPEN'"
                      params=(new_status,now,trade_id)
                  elif new_status=='TP2_HIT':
                      sql=f"UPDATE trades SET trade_status={ph},tp2_hit_at={ph},exit_price={ph},realized_r={ph},slippage=NULL,outcome=1 WHERE id={ph} AND trade_status IN ('OPEN','TP1_HIT')"
                      params=(new_status,now,exit_price,realized_r,trade_id)
                  else:
                      sql=f"UPDATE trades SET trade_status={ph},sl_hit_at={ph},exit_price={ph},realized_r={ph},slippage=NULL,outcome=0 WHERE id={ph} AND trade_status IN ('OPEN','TP1_HIT')"
                      params=(new_status,now,exit_price,realized_r,trade_id)
                  cur.execute(sql,params); changed=cur.rowcount==1; conn.commit()
              except Exception as e:
                  try: conn.rollback()
                  except Exception: pass
                  system_monitor.record_error('TRADE_STATE',e); return False
              finally:
                  release_db_connection(conn)

              if changed and new_status in {'SL_HIT','TP2_HIT'}:
                  payload=_build_trade_learning_payload(trade_id,new_status)
                  if payload:
                      enqueue_learning_event('TRADE_OUTCOME',f'trade_outcome:{trade_id}',payload,priority=1 if new_status=='SL_HIT' else 3)
              return changed
          '''
          text = replace_def(text, 'update_trade_state', new_update_trade_state)

          new_monitor = r'''
          def monitor_open_trades():
              conn = get_db_connection()
              try:
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, signal_type, entry_price, sl, tp1, tp2, trade_status FROM trades WHERE outcome IS NULL AND trade_status IN ('OPEN','TP1_HIT')")
                  rows = cursor.fetchall()
              except Exception as e:
                  print(f"⚠️ تعذر تحميل الصفقات المفتوحة: {e}")
                  rows = []
              finally:
                  release_db_connection(conn)

              price = get_market_data().get('gold', 0.0)
              if price <= 0:
                  return

              for row in rows:
                  trade_id, sig_type, entry, sl, tp1, tp2, status = row
                  try:
                      events = evaluate_trade_bar(sig_type, status, float(entry), float(sl), float(tp1), float(tp2), price, price, price)
                      current_status = status
                      for event in events:
                          if event == 'TP1_HIT' and current_status == 'OPEN':
                              if update_trade_state(trade_id, 'TP1_HIT'):
                                  current_status = 'TP1_HIT'
                          elif event == 'TP2_HIT':
                              final_entry = float(tp2)
                              risk_r = calculate_realized_r(sig_type, float(entry), float(sl), final_entry)
                              update_trade_state(trade_id, 'TP2_HIT', final_entry, risk_r, None)
                              break
                          elif event == 'SL_HIT':
                              final_entry = float(sl)
                              risk_r = calculate_realized_r(sig_type, float(entry), float(sl), final_entry)
                              update_trade_state(trade_id, 'SL_HIT', final_entry, risk_r, None)
                              break
                  except Exception as e:
                      print(f"⚠️ خطأ في مراقبة الصفقة {trade_id}: {e}")
          '''
          text = replace_def(text, 'monitor_open_trades', new_monitor)

          new_historical = r'''
          def update_open_trades_outcome_historical(df_m15):
              """Historical evaluator sharing the exact Phase 1 lifecycle with live monitoring."""
              conn = get_db_connection()
              try:
                  cursor = conn.cursor()
                  cursor.execute("SELECT id, timestamp, signal_type, entry_price, sl, tp1, tp2, trade_status FROM trades WHERE outcome IS NULL AND trade_status IN ('OPEN','TP1_HIT')")
                  open_trades = cursor.fetchall()
              except Exception as e:
                  print(f"خطأ تحميل الصفقات المفتوحة للتقييم التاريخي: {e}")
                  open_trades = []
              finally:
                  release_db_connection(conn)

              if not open_trades:
                  return

              df_clean = clean_df_columns(df_m15.copy()) if df_m15 is not None and not df_m15.empty else pd.DataFrame()
              if df_clean.empty:
                  return
              if not isinstance(df_clean.index, pd.DatetimeIndex):
                  df_clean.index = pd.to_datetime(df_clean.index, utc=True)
              elif df_clean.index.tz is None:
                  df_clean.index = df_clean.index.tz_localize(timezone.utc)
              else:
                  df_clean.index = df_clean.index.tz_convert(timezone.utc)
              df_clean = df_clean.sort_index()

              for trade_id, trade_time_str, sig_type, entry, sl, tp1, tp2, status in open_trades:
                  try:
                      trade_time = trade_time_str if isinstance(trade_time_str, datetime) else datetime.strptime(str(trade_time_str)[:19], "%Y-%m-%d %H:%M:%S")
                      if trade_time.tzinfo is None:
                          trade_time = trade_time.replace(tzinfo=timezone.utc)
                      current_status = status if status in {'OPEN','TP1_HIT'} else 'OPEN'

                      sub_df = df_clean[df_clean.index >= trade_time]
                      for _, bar in sub_df.iterrows():
                          events = evaluate_trade_bar(
                              sig_type, current_status, float(entry), float(sl), float(tp1), float(tp2),
                              float(bar['Open']), float(bar['High']), float(bar['Low'])
                          )
                          for event in events:
                              if event == 'TP1_HIT' and current_status == 'OPEN':
                                  if update_trade_state(trade_id, 'TP1_HIT'):
                                      current_status = 'TP1_HIT'
                              elif event == 'TP2_HIT':
                                  exit_price = float(tp2)
                                  realized_r = calculate_realized_r(sig_type, float(entry), float(sl), exit_price)
                                  if update_trade_state(trade_id, 'TP2_HIT', exit_price, realized_r, None):
                                      current_status = 'TP2_HIT'
                              elif event == 'SL_HIT':
                                  exit_price = float(sl)
                                  realized_r = calculate_realized_r(sig_type, float(entry), float(sl), exit_price)
                                  if update_trade_state(trade_id, 'SL_HIT', exit_price, realized_r, None):
                                      current_status = 'SL_HIT'
                              if current_status in {'TP2_HIT','SL_HIT'}:
                                  break
                          if current_status in {'TP2_HIT','SL_HIT'}:
                              break

                      if current_status not in {'TP2_HIT','SL_HIT'}:
                          live_price = get_market_data().get('gold', 0.0)
                          if live_price > 1000:
                              events = evaluate_trade_bar(sig_type, current_status, float(entry), float(sl), float(tp1), float(tp2), live_price, live_price, live_price)
                              for event in events:
                                  if event == 'TP1_HIT' and current_status == 'OPEN':
                                      if update_trade_state(trade_id, 'TP1_HIT'):
                                          current_status = 'TP1_HIT'
                                  elif event == 'TP2_HIT':
                                      exit_price = float(tp2)
                                      realized_r = calculate_realized_r(sig_type, float(entry), float(sl), exit_price)
                                      update_trade_state(trade_id, 'TP2_HIT', exit_price, realized_r, None)
                                      current_status = 'TP2_HIT'
                                      break
                                  elif event == 'SL_HIT':
                                      exit_price = float(sl)
                                      realized_r = calculate_realized_r(sig_type, float(entry), float(sl), exit_price)
                                      update_trade_state(trade_id, 'SL_HIT', exit_price, realized_r, None)
                                      current_status = 'SL_HIT'
                                      break
                  except Exception as e:
                      print(f"خطأ في تقييم الصفقة التاريخية رقم {trade_id}: {e}")
          '''
          text = replace_def(text, 'update_open_trades_outcome_historical', new_historical)

          marker = "        gemini_eval = gemini_verify_signal(candidate_signal, {'h4_trend':h4_trend,'state_label':state})"
          if "validate_trade_levels(signal_type, current_price, sl, tp1, tp2)" not in text:
              text = text.replace(marker, "        validate_trade_levels(signal_type, current_price, sl, tp1, tp2)\n\n" + marker, 1)

          p.write_text(text, encoding='utf-8')
          ast.parse(text)
          print('Phase 1 patch applied and bot.py parses successfully.')
          PY

      - name: Phase 1 logic tests
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, math
          from pathlib import Path

          source = Path('bot.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          wanted = {'validate_trade_levels','calculate_realized_r','evaluate_trade_bar'}
          ns = {'np': __import__('numpy')}
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name in wanted:
                  exec(compile(ast.Module(body=[node], type_ignores=[]), 'bot.py', 'exec'), ns)

          validate = ns['validate_trade_levels']
          calc_r = ns['calculate_realized_r']
          eval_bar = ns['evaluate_trade_bar']

          assert validate('BUY', 100, 95, 105, 110)
          assert validate('SELL', 100, 105, 95, 90)
          for args in [('BUY',100,105,95,90), ('SELL',100,95,105,110)]:
              try:
                  validate(*args)
                  raise AssertionError('invalid levels were accepted')
              except ValueError:
                  pass

          assert math.isclose(calc_r('BUY',100,95,110), 2.0)
          assert math.isclose(calc_r('SELL',100,105,90), 2.0)
          assert math.isclose(calc_r('BUY',100,95,95), -1.0)
          assert math.isclose(calc_r('SELL',100,105,105), -1.0)

          assert eval_bar('BUY','OPEN',100,95,105,110,100,106,99) == ['TP1_HIT']
          assert eval_bar('BUY','TP1_HIT',100,95,105,110,106,111,104) == ['TP2_HIT']
          assert eval_bar('SELL','OPEN',100,105,95,90,100,101,94) == ['TP1_HIT']
          assert eval_bar('SELL','TP1_HIT',100,105,95,90,94,96,89) == ['TP2_HIT']
          assert eval_bar('SELL','OPEN',100,105,95,90,100,106,99) == ['SL_HIT']
          print('Phase 1 lifecycle logic tests passed.')
          PY
          python3 -m py_compile bot.py

      - name: Review diff and commit final change
        shell: bash
        run: |
          git diff -- bot.py
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/phase1_lifecycle.yml
          git commit -m "fix: unify Phase 1 trade lifecycle"
          git push origin main
