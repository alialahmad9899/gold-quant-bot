name: yahoo-spot-hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RED - prove shared historical/live assumptions are unsafe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('bot.py').read_text(encoding='utf-8')
          assert "YAHOO_LIVE_COOLDOWN_SECONDS" in t, "RED: live/historical Yahoo state is not explicitly separated"
          PY

      - name: Apply Yahoo Spot hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')

          old_consts = """ARGENT_AUTH_COOLDOWN_SECONDS = int(os.getenv('ARGENT_AUTH_COOLDOWN_SECONDS', '600'))
          ARGENT_TRANSIENT_COOLDOWN_SECONDS = int(os.getenv('ARGENT_TRANSIENT_COOLDOWN_SECONDS', '300'))
          ARGENT_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_COOLDOWN_SECONDS = int(os.getenv('YAHOO_COOLDOWN_SECONDS', '1800'))
          YAHOO_FETCH_INTERVAL_SECONDS = int(os.getenv('YAHOO_FETCH_INTERVAL_SECONDS', '900'))
          YAHOO_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_STATE_LOCK = threading.Lock()"""
          old_consts = textwrap.dedent(old_consts).strip()
          new_consts = textwrap.dedent("""
          YAHOO_LIVE_COOLDOWN_SECONDS = int(os.getenv('YAHOO_LIVE_COOLDOWN_SECONDS', '300'))
          YAHOO_HIST_COOLDOWN_SECONDS = int(os.getenv('YAHOO_HIST_COOLDOWN_SECONDS', '1800'))
          YAHOO_FETCH_INTERVAL_SECONDS = int(os.getenv('YAHOO_FETCH_INTERVAL_SECONDS', '900'))
          YAHOO_LIVE_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_HIST_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_STATE_LOCK = threading.Lock()
          """).strip()
          if old_consts in text:
              text = text.replace(old_consts, new_consts, 1)
          else:
              text = re.sub(r"ARGENT_AUTH_COOLDOWN_SECONDS.*?YAHOO_STATE_LOCK = threading\.Lock\(\)", new_consts, text, count=1, flags=re.S)

          def replace_function(src, name, replacement):
              pattern = re.compile(rf"^def {re.escape(name)}\(.*?(?=^def |^class |\Z)", re.M | re.S)
              m = pattern.search(src)
              if not m:
                  raise RuntimeError(f'missing function: {name}')
              return src[:m.start()] + textwrap.dedent(replacement).strip('\n') + '\n\n' + src[m.end():].lstrip('\n')

          text = replace_function(text, '_set_yahoo_cooldown', r'''
          def _set_yahoo_hist_cooldown(error_type, error_message):
              with YAHOO_STATE_LOCK:
                  YAHOO_HIST_FEED_STATE['blocked_until'] = time.monotonic() + max(1, YAHOO_HIST_COOLDOWN_SECONDS)
                  YAHOO_HIST_FEED_STATE['error_type'] = str(error_type)
                  YAHOO_HIST_FEED_STATE['error_message'] = str(error_message or '')[:300]
              logger.warning('[MARKET_DATA_HIST] Yahoo cooldown type=%s seconds=%s message=%s', error_type, YAHOO_HIST_COOLDOWN_SECONDS, str(error_message or '')[:300])

          def _yahoo_hist_cooldown_active():
              with YAHOO_STATE_LOCK:
                  return time.monotonic() < float(YAHOO_HIST_FEED_STATE.get('blocked_until', 0.0) or 0.0)
          ''')

          # Fix historical fetch to use its own circuit and preserve the exact cause.
          text = replace_function(text, 'fetch_yahoo_direct', r'''
          def fetch_yahoo_direct(symbol, range_str="10d", interval_str="15m"):
              if _yahoo_hist_cooldown_active():
                  return pd.DataFrame()
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36',
                  'Accept': 'application/json,text/html,application/xhtml+xml',
                  'Referer': 'https://finance.yahoo.com/'
              }
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
              params = {'interval': interval_str, 'range': range_str}
              try:
                  client = curl_requests if curl_requests is not None else requests
                  response = client.get(url, params=params, headers=headers, timeout=8, **({'impersonate': 'chrome124'} if client is curl_requests else {}))
                  status_code = int(getattr(response, 'status_code', 0) or 0)
                  if status_code == 429:
                      _set_yahoo_hist_cooldown('rate_limited', 'Yahoo historical HTTP 429 rate limit.')
                      return pd.DataFrame()
                  if status_code != 200:
                      message = f'Yahoo historical HTTP {status_code}.'
                      if status_code >= 500:
                          _set_yahoo_hist_cooldown('server_error', message)
                      logger.warning('[MARKET_DATA_HIST] failure type=http_error http_status=%s message=%s', status_code, message)
                      return pd.DataFrame()
                  data = response.json()
                  result = (data.get('chart') or {}).get('result') or []
                  if not result or not isinstance(result[0], dict):
                      _set_yahoo_hist_cooldown('missing_result', 'Yahoo chart.result is missing.')
                      return pd.DataFrame()
                  timestamps = result[0].get('timestamp') or []
                  quote = (result[0].get('indicators') or {}).get('quote') or []
                  if not timestamps or not quote:
                      _set_yahoo_hist_cooldown('missing_ohlc', f'Yahoo {symbol} {interval_str} returned no OHLC rows.')
                      return pd.DataFrame()
                  q = quote[0]
                  df = pd.DataFrame({
                      'Open': q.get('open', []), 'High': q.get('high', []),
                      'Low': q.get('low', []), 'Close': q.get('close', []),
                      'Volume': q.get('volume', [0] * len(timestamps))
                  }, index=pd.to_datetime(timestamps, unit='s', utc=True)).dropna(subset=['Close'])
                  if df.empty:
                      _set_yahoo_hist_cooldown('empty_ohlc', f'Yahoo {symbol} {interval_str} returned an empty dataframe.')
                      return pd.DataFrame()
                  with YAHOO_STATE_LOCK:
                      YAHOO_HIST_FEED_STATE['blocked_until'] = 0.0
                      YAHOO_HIST_FEED_STATE['error_type'] = None
                      YAHOO_HIST_FEED_STATE['error_message'] = None
                  return df
              except requests.Timeout as exc:
                  msg = str(exc)[:300]
                  _set_yahoo_hist_cooldown('timeout', msg)
                  return pd.DataFrame()
              except requests.RequestException as exc:
                  msg = str(exc)[:300]
                  _set_yahoo_hist_cooldown('network', msg)
                  return pd.DataFrame()
              except Exception as exc:
                  msg = f'{type(exc).__name__}: {exc}'[:300]
                  if any(token in msg.lower() for token in ('429', 'rate limit', 'too many requests', 'yfratelimiterror')):
                      _set_yahoo_hist_cooldown('rate_limited', msg)
                  else:
                      _set_yahoo_hist_cooldown('malformed_response', msg)
                  return pd.DataFrame()
          ''')

          # Live feed: use curl_cffi when available, and preserve a diagnostic reason in MISSING.
          text = replace_function(text, 'fetch_canonical_xauusd_feed', r'''
          def fetch_canonical_xauusd_feed():
              """Canonical XAUUSD Spot from Yahoo XAUUSD=X only; no futures/crypto/scraping fallback."""
              now_m = time.monotonic()
              with PRICE_FEED_LOCK:
                  cached = CANONICAL_XAUUSD_FEED_CACHE.get('feed')
                  last = float(CANONICAL_XAUUSD_FEED_CACHE.get('last_request_monotonic', 0.0) or 0.0)
                  if now_m - last < PRICE_FEED_MIN_REQUEST_INTERVAL:
                      return _refresh_cached_feed_status(cached)
                  if _yahoo_live_cooldown_active():
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed(
                          YAHOO_LIVE_FEED_STATE.get('error_type') or 'cooldown',
                          YAHOO_LIVE_FEED_STATE.get('error_message') or 'Yahoo Spot cooldown is active.'
                      )
                  CANONICAL_XAUUSD_FEED_CACHE['last_request_monotonic'] = now_m

                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36',
                      'Accept': 'application/json', 'Referer': 'https://finance.yahoo.com/'
                  }
                  try:
                      client = curl_requests if curl_requests is not None else requests
                      response = client.get(
                          'https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X',
                          params={'interval': '1m', 'range': '1d'}, headers=headers, timeout=8,
                          **({'impersonate': 'chrome124'} if client is curl_requests else {})
                      )
                  except requests.Timeout as exc:
                      msg = str(exc)[:300]
                      _set_yahoo_live_cooldown('timeout', msg)
                      _log_yahoo_live_failure('timeout', None, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('timeout', msg)
                  except requests.RequestException as exc:
                      msg = str(exc)[:300]
                      _set_yahoo_live_cooldown('network', msg)
                      _log_yahoo_live_failure('network', None, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('network', msg)
                  except Exception as exc:
                      msg = f'{type(exc).__name__}: {exc}'[:300]
                      _set_yahoo_live_cooldown('network', msg)
                      _log_yahoo_live_failure('network', None, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('network', msg)

                  code = int(getattr(response, 'status_code', 0) or 0)
                  if code == 429:
                      msg = _yahoo_live_error_message(response) or 'Yahoo Spot HTTP 429 rate limit.'
                      _set_yahoo_live_cooldown('rate_limited', msg)
                      _log_yahoo_live_failure('rate_limited', code, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('rate_limited', msg)
                  if 500 <= code <= 599:
                      msg = _yahoo_live_error_message(response) or f'Yahoo Spot HTTP {code}.'
                      _set_yahoo_live_cooldown('server_error', msg)
                      _log_yahoo_live_failure('server_error', code, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('server_error', msg)
                  if code != 200:
                      msg = _yahoo_live_error_message(response) or f'Yahoo Spot HTTP {code}.'
                      _log_yahoo_live_failure('http_error', code, msg)
                      CANONICAL_XAUUSD_FEED_CACHE['feed'] = _build_missing_yahoo_feed('http_error', msg)
                      return _refresh_cached_feed_status(CANONICAL_XAUUSD_FEED_CACHE['feed'])
                  try:
                      payload = response.json()
                  except Exception as exc:
                      msg = f'{type(exc).__name__}: {exc}'[:300]
                      _set_yahoo_live_cooldown('malformed_json', msg)
                      _log_yahoo_live_failure('malformed_json', code, msg)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('malformed_json', msg)

                  feed = _build_yahoo_live_feed(payload, fetched_at=datetime.now(timezone.utc))
                  if feed.get('status') == 'MISSING':
                      reason = feed.get('error_message') or 'Yahoo XAUUSD=X live response missing required fields.'
                      _set_yahoo_live_cooldown(feed.get('error_type') or 'invalid_data', reason)
                      CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
                      _log_yahoo_live_failure(feed.get('error_type'), code, reason)
                      return feed
                  with YAHOO_STATE_LOCK:
                      YAHOO_LIVE_FEED_STATE['blocked_until'] = 0.0
                      YAHOO_LIVE_FEED_STATE['error_type'] = None
                      YAHOO_LIVE_FEED_STATE['error_message'] = None
                  CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
                  return feed
          ''')

          # Historical cache must not mark failed fetches as fresh.
          text = text.replace('''            if not df_us10y_m15.empty: MARKET_DATA_CACHE["df_us10y_m15"]=df_us10y_m15
            MARKET_DATA_CACHE["last_fetch"]=now''', '''            if not df_us10y_m15.empty: MARKET_DATA_CACHE["df_us10y_m15"]=df_us10y_m15
            if not df_gold_m15.empty or not df_gold_h1.empty:
                MARKET_DATA_CACHE["last_fetch"]=now''', 1)
          text = text.replace('''        if _yahoo_cooldown_active():
            with cache_lock: return MARKET_DATA_CACHE.copy()
''', '', 1)
          text = text.replace('''        except Exception as exc:
            logger.warning('[MARKET_DATA] historical fetch failure type=%s message=%s',type(exc).__name__,str(exc)[:300])
            with cache_lock: MARKET_DATA_CACHE["last_fetch"]=now
''', '''        except Exception as exc:
            logger.warning('[MARKET_DATA_HIST] historical fetch failure type=%s message=%s',type(exc).__name__,str(exc)[:300])
''', 1)

          # Remove obsolete Argent settings and repair the price screen diagnostics.
          text = re.sub(r"ARGENT_AUTH_COOLDOWN_SECONDS.*?ARGENT_FEED_STATE = .*?\n", '', text, count=1, flags=re.S)
          text = text.replace("reason = feed.get('error_message') if feed.get('status') == 'MISSING' else None", "reason = feed.get('error_message') or feed.get('error_type') if feed.get('status') == 'MISSING' else None", 1)
          text = text.replace("reason = feed.get('error_message') or feed.get('error_type') if feed.get('status') == 'MISSING' else None", "reason = (feed.get('error_message') or feed.get('error_type') or 'Unknown Yahoo Spot feed failure') if feed.get('status') == 'MISSING' else None", 1)

          # Ensure reset state uses the real provider and diagnostics.
          text = text.replace("'provider':'legacy provider','status':'MISSING'", "'provider':'Yahoo Finance','status':'MISSING','error_type':'reset','error_message':'Price feed reset; awaiting next Yahoo XAUUSD=X refresh.'", 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 -m py_compile bot.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import ast
          t = Path('bot.py').read_text(encoding='utf-8')
          ast.parse(t)
          assert 'https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X' in t
          assert 'YAHOO_LIVE_COOLDOWN_SECONDS' in t
          assert 'YAHOO_HIST_COOLDOWN_SECONDS' in t
          assert 'YAHOO_LIVE_FEED_STATE' in t
          assert 'YAHOO_HIST_FEED_STATE' in t
          assert 'GC=F' not in t
          assert 'PAXGUSDT' not in t
          assert 'ifcmarkets.net' not in t.lower()
          assert 'api.argentapi.com' not in t.lower()
          assert 'METALS_DEV_API_KEY' not in t
          assert "MARKET_DATA_CACHE[\"last_fetch\"]=now" in t
          print('SPOT_HARDENING_STATIC_OK')
          PY

      - name: Phase1 regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, math
          text = Path('bot.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          wanted = {'validate_trade_levels','_calculate_realized_r','evaluate_trade_lifecycle'}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          ns = {'math': math, 'np': type('FakeNP', (), {'isfinite': staticmethod(math.isfinite)})}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), 'bot.py', 'exec'), ns)
          v = ns['validate_trade_levels']
          assert v('BUY', 100, 95, 110, 120)[0]
          assert v('SELL', 100, 105, 90, 80)[0]
          assert not v('BUY', 100, 105, 110, 120)[0]
          assert not v('SELL', 100, 95, 90, 80)[0]
          r = ns['_calculate_realized_r']
          assert math.isclose(r('BUY', 100, 120, 95), 4.0)
          assert math.isclose(r('SELL', 100, 80, 105), 4.0)
          events = ns['evaluate_trade_lifecycle']('BUY','OPEN',100,95,110,120,price=112)
          assert events == [('TP1_HIT',110.0)]
          events = ns['evaluate_trade_lifecycle']('SELL','OPEN',100,105,90,80,price=78)
          assert events == [('TP1_HIT',90.0),('TP2_HIT',78.0)]
          print('PHASE1_REGRESSION_OK')
          PY

      - name: Publish bot.py only and remove temporary workflow
        run: |
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/workflows/yahoo_spot_hardening.yml
          git commit -m "fix: harden Yahoo XAUUSD spot feed"
          git push origin main
