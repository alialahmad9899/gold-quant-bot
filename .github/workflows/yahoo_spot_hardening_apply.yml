name: yahoo-spot-hardening-apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply feed-only hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re
          import textwrap

          p = Path('bot.py')
          text = p.read_text(encoding='utf-8')
          original = text

          # Make the optional curl_cffi path explicit so requests does not receive
          # curl_cffi-only arguments when the package is unavailable.
          old_import = """try:\n    from curl_cffi import requests as curl_requests\nexcept ImportError:\n    curl_requests = requests\n"""
          new_import = """try:\n    from curl_cffi import requests as curl_requests\n    HAS_CURL_CFFI = True\nexcept ImportError:\n    curl_requests = requests\n    HAS_CURL_CFFI = False\n"""
          if old_import not in text:
              raise RuntimeError('curl_cffi import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_consts = textwrap.dedent("""
          ARGENT_AUTH_COOLDOWN_SECONDS = int(os.getenv('ARGENT_AUTH_COOLDOWN_SECONDS', '600'))
          ARGENT_TRANSIENT_COOLDOWN_SECONDS = int(os.getenv('ARGENT_TRANSIENT_COOLDOWN_SECONDS', '300'))
          ARGENT_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_COOLDOWN_SECONDS = int(os.getenv('YAHOO_COOLDOWN_SECONDS', '1800'))
          YAHOO_FETCH_INTERVAL_SECONDS = int(os.getenv('YAHOO_FETCH_INTERVAL_SECONDS', '900'))
          YAHOO_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_STATE_LOCK = threading.Lock()
          """).strip()
          new_consts = textwrap.dedent("""
          YAHOO_LIVE_COOLDOWN_SECONDS = int(os.getenv('YAHOO_LIVE_COOLDOWN_SECONDS', '300'))
          YAHOO_HIST_COOLDOWN_SECONDS = int(os.getenv('YAHOO_HIST_COOLDOWN_SECONDS', '1800'))
          YAHOO_FETCH_INTERVAL_SECONDS = int(os.getenv('YAHOO_FETCH_INTERVAL_SECONDS', '900'))
          YAHOO_LIVE_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_HIST_FEED_STATE = {'blocked_until': 0.0, 'error_type': None, 'error_message': None}
          YAHOO_STATE_LOCK = threading.Lock()
          """).strip()
          if old_consts not in text:
              raise RuntimeError('Yahoo state constant anchor not found')
          text = text.replace(old_consts, new_consts, 1)

          def replace_function(src, name, replacement):
              tree = ast.parse(src)
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None:
                  raise RuntimeError(f'Function not found: {name}')
              lines = src.splitlines(True)
              return ''.join(lines[:node.lineno - 1] + [textwrap.dedent(replacement).strip('\n') + '\n\n'] + lines[node.end_lineno:])

          text = replace_function(text, '_set_yahoo_cooldown', r'''
          def _set_yahoo_hist_cooldown(error_type, error_message):
              with YAHOO_STATE_LOCK:
                  YAHOO_HIST_FEED_STATE['blocked_until'] = time.monotonic() + max(1, YAHOO_HIST_COOLDOWN_SECONDS)
                  YAHOO_HIST_FEED_STATE['error_type'] = str(error_type)
                  YAHOO_HIST_FEED_STATE['error_message'] = str(error_message or '')[:300]
              logger.warning('[MARKET_DATA_HIST] Yahoo cooldown type=%s seconds=%s message=%s', error_type, YAHOO_HIST_COOLDOWN_SECONDS, str(error_message or '')[:300])

          def _yahoo_hist_cooldown_active():
              with YAHOO_STATE_LOCK:
                  return time.monotonic() < float(YAHOO_HIST_FEED_STATE.get('blocked_until', 0.0) or 0.0)
          ''')

          text = replace_function(text, 'fetch_yahoo_direct', r'''
          def fetch_yahoo_direct(symbol, range_str="10d", interval_str="15m"):
              if _yahoo_hist_cooldown_active():
                  return pd.DataFrame()
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36',
                  'Accept': 'application/json,text/html,application/xhtml+xml',
                  'Referer': 'https://finance.yahoo.com/'
              }
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"
              try:
                  kwargs = {'timeout': 8}
                  if HAS_CURL_CFFI:
                      kwargs['impersonate'] = 'chrome124'
                  response = curl_requests.get(url, params={'interval': interval_str, 'range': range_str}, headers=headers, **kwargs)
                  status_code = int(getattr(response, 'status_code', 0) or 0)
                  if status_code == 429:
                      _set_yahoo_hist_cooldown('rate_limited', 'Yahoo historical HTTP 429 rate limit.')
                      return pd.DataFrame()
                  if status_code != 200:
                      message = f'Yahoo historical HTTP {status_code}.'
                      if status_code >= 500:
                          _set_yahoo_hist_cooldown('server_error', message)
                      logger.warning('[MARKET_DATA_HIST] failure type=http_error http_status=%s message=%s', status_code, message)
                      return pd.DataFrame()
                  data = response.json()
                  result = (data.get('chart') or {}).get('result') or []
                  if not result or not isinstance(result[0], dict):
                      _set_yahoo_hist_cooldown('missing_result', 'Yahoo chart.result is missing.')
                      return pd.DataFrame()
                  timestamps = result[0].get('timestamp') or []
                  quotes = (result[0].get('indicators') or {}).get('quote') or []
                  if not timestamps or not quotes:
                      _set_yahoo_hist_cooldown('missing_ohlc', f'Yahoo {symbol} {interval_str} returned no OHLC rows.')
                      return pd.DataFrame()
                  quote = quotes[0]
                  df = pd.DataFrame({
                      'Open': quote.get('open', []),
                      'High': quote.get('high', []),
                      'Low': quote.get('low', []),
                      'Close': quote.get('close', []),
                      'Volume': quote.get('volume', [0] * len(timestamps)),
                  }, index=pd.to_datetime(timestamps, unit='s', utc=True)).dropna(subset=['Close'])
                  if df.empty:
                      _set_yahoo_hist_cooldown('empty_ohlc', f'Yahoo {symbol} {interval_str} returned empty OHLC.')
                      return pd.DataFrame()
                  with YAHOO_STATE_LOCK:
                      YAHOO_HIST_FEED_STATE['blocked_until'] = 0.0
                      YAHOO_HIST_FEED_STATE['error_type'] = None
                      YAHOO_HIST_FEED_STATE['error_message'] = None
                  return df
              except Exception as exc:
                  message = f'{type(exc).__name__}: {exc}'[:300]
                  if any(token in message.lower() for token in ('429', 'rate limit', 'too many requests', 'yfratelimiterror')):
                      _set_yahoo_hist_cooldown('rate_limited', message)
                  elif 'timeout' in message.lower():
                      _set_yahoo_hist_cooldown('timeout', message)
                  else:
                      _set_yahoo_hist_cooldown('network_or_response', message)
                  return pd.DataFrame()
          ''')

          text = replace_function(text, 'fetch_canonical_xauusd_feed', r'''
          def fetch_canonical_xauusd_feed():
              """Canonical live XAUUSD Spot from Yahoo XAUUSD=X only; no futures/crypto/scraping fallback."""
              now_m = time.monotonic()
              with PRICE_FEED_LOCK:
                  cached = CANONICAL_XAUUSD_FEED_CACHE.get('feed')
                  last = float(CANONICAL_XAUUSD_FEED_CACHE.get('last_request_monotonic', 0.0) or 0.0)
                  if now_m - last < PRICE_FEED_MIN_REQUEST_INTERVAL:
                      return _refresh_cached_feed_status(cached)
                  if _yahoo_live_cooldown_active():
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed(
                          YAHOO_LIVE_FEED_STATE.get('error_type') or 'cooldown',
                          YAHOO_LIVE_FEED_STATE.get('error_message') or 'Yahoo Spot cooldown is active.'
                      )
                  CANONICAL_XAUUSD_FEED_CACHE['last_request_monotonic'] = now_m
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36',
                      'Accept': 'application/json',
                      'Referer': 'https://finance.yahoo.com/'
                  }
                  try:
                      kwargs = {'timeout': 8}
                      if HAS_CURL_CFFI:
                          kwargs['impersonate'] = 'chrome124'
                      response = curl_requests.get(
                          'https://query1.finance.yahoo.com/v8/finance/chart/XAUUSD=X',
                          params={'interval': '1m', 'range': '1d'},
                          headers=headers,
                          **kwargs
                      )
                  except Exception as exc:
                      message = f'{type(exc).__name__}: {exc}'[:300]
                      _set_yahoo_live_cooldown('network', message)
                      _log_yahoo_live_failure('network', None, message)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('network', message)

                  code = int(getattr(response, 'status_code', 0) or 0)
                  if code == 429:
                      message = _yahoo_live_error_message(response) or 'Yahoo Spot HTTP 429 rate limit.'
                      _set_yahoo_live_cooldown('rate_limited', message)
                      _log_yahoo_live_failure('rate_limited', code, message)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('rate_limited', message)
                  if 500 <= code <= 599:
                      message = _yahoo_live_error_message(response) or f'Yahoo Spot HTTP {code}.'
                      _set_yahoo_live_cooldown('server_error', message)
                      _log_yahoo_live_failure('server_error', code, message)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('server_error', message)
                  if code != 200:
                      message = _yahoo_live_error_message(response) or f'Yahoo Spot HTTP {code}.'
                      feed = _build_missing_yahoo_feed('http_error', message)
                      CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
                      _log_yahoo_live_failure('http_error', code, message)
                      return feed

                  try:
                      payload = response.json()
                  except Exception as exc:
                      message = f'{type(exc).__name__}: {exc}'[:300]
                      _set_yahoo_live_cooldown('malformed_json', message)
                      _log_yahoo_live_failure('malformed_json', code, message)
                      return _refresh_cached_feed_status(cached) if cached else _build_missing_yahoo_feed('malformed_json', message)

                  feed = _build_yahoo_live_feed(payload, fetched_at=datetime.now(timezone.utc))
                  if feed.get('status') == 'MISSING':
                      message = feed.get('error_message') or 'Yahoo XAUUSD=X live response missing required fields.'
                      _set_yahoo_live_cooldown(feed.get('error_type') or 'invalid_data', message)
                      CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
                      _log_yahoo_live_failure(feed.get('error_type'), code, message)
                      return feed

                  with YAHOO_STATE_LOCK:
                      YAHOO_LIVE_FEED_STATE['blocked_until'] = 0.0
                      YAHOO_LIVE_FEED_STATE['error_type'] = None
                      YAHOO_LIVE_FEED_STATE['error_message'] = None
                  CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed
                  return feed
          ''')

          # Historical cache freshness: failed requests must not reset last_fetch.
          old_cache_tail = """                if not df_us10y_m15.empty: MARKET_DATA_CACHE[\"df_us10y_m15\"]=df_us10y_m15\n                MARKET_DATA_CACHE[\"last_fetch\"]=now"""
          new_cache_tail = """                if not df_us10y_m15.empty: MARKET_DATA_CACHE[\"df_us10y_m15\"]=df_us10y_m15\n                if not df_gold_h1.empty or not df_gold_m15.empty:\n                    MARKET_DATA_CACHE[\"last_fetch\"]=now"""
          if old_cache_tail not in text:
              raise RuntimeError('historical cache tail anchor not found')
          text = text.replace(old_cache_tail, new_cache_tail, 1)
          text = text.replace("""        if _yahoo_cooldown_active():\n            with cache_lock: return MARKET_DATA_CACHE.copy()\n""", '', 1)
          text = text.replace("""        except Exception as exc:\n            logger.warning('[MARKET_DATA] historical fetch failure type=%s message=%s',type(exc).__name__,str(exc)[:300])\n            with cache_lock: MARKET_DATA_CACHE[\"last_fetch\"]=now\n""", """        except Exception as exc:\n            logger.warning('[MARKET_DATA_HIST] historical fetch failure type=%s message=%s',type(exc).__name__,str(exc)[:300])\n""", 1)

          # Remove obsolete provider configuration.
          text = text.replace("    reason = feed.get('error_message') if feed.get('status') == 'MISSING' else None", "    reason = (feed.get('error_message') or feed.get('error_type') or 'Unknown Yahoo Spot feed failure') if feed.get('status') == 'MISSING' else None", 1)
          text = text.replace("'provider':'legacy provider','status':'MISSING'", "'provider':'Yahoo Finance','status':'MISSING','error_type':'reset','error_message':'Price feed reset; awaiting next Yahoo XAUUSD=X refresh.'", 1)
          if re.search(r'ARGENT_(AUTH|TRANSIENT)_COOLDOWN_SECONDS|ARGENT_FEED_STATE', text):
              raise RuntimeError('obsolete ArgentAPI state remains')

          if text == original:
              raise RuntimeError('patch produced no changes')
          ast.parse(text)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax, source policy, and Phase 1
        run: |
          python3 -m py_compile bot.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import ast, math, datetime as dt
          text = Path('bot.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          assert 'XAUUSD=X' in text
          assert 'YAHOO_LIVE_COOLDOWN_SECONDS' in text
          assert 'YAHOO_HIST_COOLDOWN_SECONDS' in text
          assert 'YAHOO_LIVE_FEED_STATE' in text
          assert 'YAHOO_HIST_FEED_STATE' in text
          assert "fetch_canonical_xauusd_feed" in text
          assert "fetch_yahoo_direct" in text
          for forbidden in ('GC=F','PAXGUSDT','ifcmarkets.net','METALS_DEV_API_KEY','ARGENT_API_KEY','api.argentapi.com'):
              assert forbidden.lower() not in text.lower(), forbidden

          wanted = {'_trade_direction','validate_trade_levels','_calculate_realized_r','evaluate_trade_lifecycle','_build_missing_yahoo_feed','_build_yahoo_live_feed'}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          ns = {'np': __import__('numpy'), 'math': math, 'datetime': dt.datetime, 'timezone': dt.timezone, 'timedelta': dt.timedelta, 'PRICE_FEED_STALE_SECONDS': 90}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), 'bot.py', 'exec'), ns)

          v = ns['validate_trade_levels']
          r = ns['_calculate_realized_r']
          e = ns['evaluate_trade_lifecycle']
          assert v('BUY', 100, 95, 110, 120)[0]
          assert v('SELL', 100, 105, 90, 80)[0]
          assert not v('BUY', 100, 105, 110, 120)[0]
          assert not v('SELL', 100, 95, 90, 80)[0]
          assert math.isclose(r('BUY', 100, 95, 120), 4.0)
          assert math.isclose(r('SELL', 100, 105, 80), 4.0)
          assert e('BUY','OPEN',100,95,110,120,price=112)==[('TP1_HIT',110.0)]
          assert e('BUY','TP1_HIT',100,95,110,120,price=121)==[('TP2_HIT',121.0)]
          assert e('SELL','OPEN',100,105,90,80,price=91)==[('TP1_HIT',90.0)]
          assert e('SELL','TP1_HIT',100,105,90,80,price=79)==[('TP2_HIT',79.0)]

          valid = {
            'chart': {'result': [{'meta': {
              'symbol': 'XAUUSD=X', 'regularMarketPrice': 3401.25,
              'regularMarketTime': dt.datetime.now(dt.timezone.utc).timestamp(),
              'bid': 3401.20, 'ask': 3401.30,
            }}]}
          }
          feed = ns['_build_yahoo_live_feed'](valid, fetched_at=dt.datetime.now(dt.timezone.utc))
          assert feed['provider'] == 'Yahoo Finance'
          assert feed['status'] == 'ACTIVE'
          assert feed['spot'] == 3401.25
          assert feed['mid'] == 3401.25
          assert feed['bid'] == 3401.2 and feed['ask'] == 3401.3
          bad = ns['_build_yahoo_live_feed']({'chart': {'result': []}})
          assert bad['status'] == 'MISSING' and bad['error_type'] == 'missing_result'
          print('YAHOO_SPOT_HARDENING_OK')
          print('PHASE1_REGRESSION_OK')
          PY

      - name: Show diff
        run: |
          git diff -- bot.py
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/workflows/yahoo_spot_hardening.yml .github/workflows/yahoo_spot_hardening_green.yml .github/workflows/yahoo_spot_hardening_apply.yml
          git diff --cached --stat
          git diff --cached --check
          git commit -m "fix: harden Yahoo XAUUSD spot feed"
          git push origin main
