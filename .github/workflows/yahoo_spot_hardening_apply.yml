name: yahoo-spot-hardening-apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and test bot.py
        run: python3 .github/patch_yahoo_feed.py

      - name: Verify diff and source policy
        run: |
          git diff --check
          grep -q "XAUUSD=X" bot.py
          ! grep -qi "GC=F" bot.py
          ! grep -qi "PAXGUSDT" bot.py
          ! grep -qi "ifcmarkets.net" bot.py
          ! grep -qi "api.argentapi.com" bot.py
          ! grep -qi "METALS_DEV_API_KEY" bot.py
          ! grep -qi "ARGENT_API_KEY" bot.py

      - name: Show final bot diff
        run: git diff -- bot.py

      - name: Commit and push bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/patch_yahoo_feed.py
          git commit -m "fix: harden Yahoo XAUUSD spot feed"
          git push origin main
