name: yahoo-spot-hardening-apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and test bot.py
        run: python3 .github/patch_yahoo_feed_v3.py

      - name: Verify deep provider cleanup
        run: |
          python3 tests/test_market_provider_hygiene.py
          python3 -m py_compile bot.py
          git diff --check
          grep -q "XAUUSD=X" bot.py
          ! grep -qi "GC=F" bot.py
          ! grep -qi "PAXGUSDT" bot.py
          ! grep -qi "ifcmarkets.net" bot.py
          ! grep -qi "api.argentapi.com" bot.py
          ! grep -qi "METALS_DEV_API_KEY" bot.py
          ! grep -qi "ARGENT_API_KEY" bot.py
          ! grep -qi "YAHOO_FEED_STATE" bot.py
          ! grep -qi "YAHOO_STATE_LOCK" bot.py

      - name: Show final bot diff
        run: git diff -- bot.py

      - name: Commit production cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch_yahoo_feed.py .github/patch_yahoo_feed_v2.py .github/patch_yahoo_feed_v3.py
          git add -A bot.py tests/test_market_provider_hygiene.py .github/patch_yahoo_feed.py .github/patch_yahoo_feed_v2.py .github/patch_yahoo_feed_v3.py
          git commit -m "fix: clean legacy gold providers and harden Yahoo market feed"
          git push origin main
