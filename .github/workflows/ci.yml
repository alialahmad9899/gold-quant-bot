name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: test-token
      BOT_PASSWORD: test-password
      TWELVE_DATA_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Gemini quota-aware patch once
        if: "!contains(github.event.head_commit.message, '[quota-routed]') && github.head_ref == 'fix/gemini-quota-aware-routing'"
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'MAX_GEMINI_CANDIDATES = int(os.getenv("MAX_GEMINI_CANDIDATES", "6"))\n',
              'MAX_GEMINI_CANDIDATES = int(os.getenv("MAX_GEMINI_CANDIDATES", "4"))\nMAX_GEMINI_ATTEMPTS = int(os.getenv("MAX_GEMINI_ATTEMPTS", "2"))\nGEMINI_RPD_COOLDOWN_SECONDS = int(os.getenv("GEMINI_RPD_COOLDOWN_SECONDS", str(6 * 60 * 60)))\n',
              1,
          )

          old_discovery = '''                DISCOVERED_MODELS_CACHE = available\n                LAST_MODELS_DISCOVERY_TIME = now\n                SESSION_BLACKLIST_404.clear()\n                logger.info("✅ [Dynamic Discovery] تم اكتشاف الموديلات المتاحة فعلياً لمفتاحك: %s", DISCOVERED_MODELS_CACHE)\n'''
          new_discovery = '''                DISCOVERED_MODELS_CACHE = available\n                LAST_MODELS_DISCOVERY_TIME = now\n                logger.info("✅ [Dynamic Discovery] تم اكتشاف الموديلات المتاحة فعلياً لمفتاحك: %s", DISCOVERED_MODELS_CACHE)\n'''
          if old_discovery not in s:
              raise SystemExit('discovery block not found')
          s = s.replace(old_discovery, new_discovery, 1)

          old_priority = '''    def score_model(name):\n        n = name.lower()\n        score = 0\n        if task_type == "vetting":\n            if 'flash' in n and 'lite' not in n:\n                score += 30\n            elif 'pro' in n:\n                score += 20\n            elif 'lite' in n:\n                score += 10\n        else:\n            if 'lite' in n:\n                score += 30\n            elif 'flash' in n:\n                score += 20\n            elif 'pro' in n:\n                score += 10\n        nums = re.findall(r'\\d+', n)\n        if nums:\n            try:\n                score += int(nums[0])\n            except Exception:\n                pass\n        return score\n\n    sorted_candidates = sorted(pool_models, key=score_model, reverse=True)\n    return sorted_candidates[:MAX_GEMINI_CANDIDATES]\n'''
          new_priority = '''    preferred_vetting = [\n        item.strip().lower()\n        for item in os.getenv(\n            "GEMINI_VETTING_PREFERRED_MODELS",\n            "gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-3.5-flash-lite,gemini-3.1-flash-lite-preview",\n        ).split(",")\n        if item.strip()\n    ]\n\n    def score_model(name):\n        n = name.lower()\n        score = 0\n        if task_type == "vetting":\n            if n in preferred_vetting:\n                score += 1000 - (preferred_vetting.index(n) * 50)\n            if 'lite' in n:\n                score += 80\n            elif 'flash' in n:\n                score += 50\n            elif 'pro' in n:\n                score += 20\n            if 'preview' not in n:\n                score += 10\n        else:\n            if 'lite' in n:\n                score += 30\n            elif 'flash' in n:\n                score += 20\n            elif 'pro' in n:\n                score += 10\n        nums = re.findall(r'\\d+', n)\n        if nums:\n            try:\n                score += int(nums[0])\n            except Exception:\n                pass\n        return score\n\n    sorted_candidates = sorted(pool_models, key=score_model, reverse=True)\n    return sorted_candidates[:MAX_GEMINI_CANDIDATES]\n'''
          if old_priority not in s:
              raise SystemExit('priority block not found')
          s = s.replace(old_priority, new_priority, 1)

          old_fallback = '''    candidates = prioritize_models_for_task(task_type=task_type)\n    if not candidates:\n        candidates = [\n            m for m in discover_available_models(force_refresh=True)\n            if m not in SESSION_BLACKLIST_404\n            and m not in SESSION_BLACKLIST_INCOMPATIBLE\n            and time.monotonic() >= MODEL_COOLDOWNS_429.get(m, 0)\n        ][:MAX_GEMINI_CANDIDATES]\n        if not candidates:\n            raise RuntimeError("لا يوجد حالياً موديل Gemini متوافق ومتاح للخدمة؛ تم احترام cooldowns والقيود المؤقتة.")\n'''
          new_fallback = '''    candidates = prioritize_models_for_task(task_type=task_type)\n    if not candidates:\n        raise RuntimeError("لا يوجد حالياً موديل Gemini متوافق ومتاح للخدمة؛ تم احترام cooldowns والقيود المؤقتة بدون إعادة اكتشاف تسبب ضغطاً إضافياً على الحصة.")\n'''
          if old_fallback not in s:
              raise SystemExit('fallback block not found')
          s = s.replace(old_fallback, new_fallback, 1)

          old_loop = '''    for target_model in candidates:\n'''
          new_loop = '''    for target_model in candidates[:MAX_GEMINI_ATTEMPTS]:\n'''
          if old_loop not in s:
              raise SystemExit('loop block not found')
          s = s.replace(old_loop, new_loop, 1)

          old_429 = '''            if "429" in err_str or "RESOURCE_EXHAUSTED" in err_str:\n                MODEL_COOLDOWNS_429[target_model] = time.monotonic() + 45\n                logger.warning(f"⏳ [429 QUOTA] [{target_model}] دخل cooldown لمدة 45 ثانية. الانتقال مباشرةً للبديل.")\n                continue\n'''
          new_429 = '''            if "429" in err_str or "RESOURCE_EXHAUSTED" in err_str:\n                cooldown_seconds = 45\n                if "PerDay" in err_str or "per day" in err_str.lower() or "RPD" in err_str:\n                    cooldown_seconds = GEMINI_RPD_COOLDOWN_SECONDS\n                MODEL_COOLDOWNS_429[target_model] = time.monotonic() + cooldown_seconds\n                logger.warning(\n                    f"⏳ [429 QUOTA] [{target_model}] دخل cooldown لمدة {cooldown_seconds} ثانية. "\n                    "لن تتم إعادة ضرب الموديل ضمن نفس نافذة الحصة."\n                )\n                continue\n'''
          if old_429 not in s:
              raise SystemExit('429 block not found')
          s = s.replace(old_429, new_429, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/test_gemini_model_routing.py')
          with t.open('a', encoding='utf-8') as f:
              f.write(r'''\n\ndef test_404_blacklist_survives_model_rediscovery(monkeypatch):\n    bot = get_bot(monkeypatch)\n    bot.SESSION_BLACKLIST_404.clear()\n    bot.MODEL_COOLDOWNS_429.clear()\n    bot.SESSION_BLACKLIST_INCOMPATIBLE.clear()\n    bot.SESSION_BLACKLIST_404.add("gemini-2.5-flash")\n    monkeypatch.setattr(\n        bot,\n        "discover_available_models",\n        lambda force_refresh=False: ["gemini-2.5-flash", "gemini-2.5-flash-lite"],\n    )\n    candidates = bot.prioritize_models_for_task()\n    assert "gemini-2.5-flash" not in candidates\n\n\ndef test_vetting_prefers_lite_and_bounds_attempts(monkeypatch):\n    bot = get_bot(monkeypatch)\n    bot.SESSION_BLACKLIST_404.clear()\n    bot.SESSION_BLACKLIST_INCOMPATIBLE.clear()\n    bot.MODEL_COOLDOWNS_429.clear()\n    monkeypatch.setattr(\n        bot,\n        "discover_available_models",\n        lambda force_refresh=False: [\n            "gemini-3.7-flash",\n            "gemini-3.1-flash-lite",\n            "gemini-2.5-pro",\n            "gemini-2.5-flash-lite",\n        ],\n    )\n    candidates = bot.prioritize_models_for_task()\n    assert candidates[0] in {"gemini-3.1-flash-lite", "gemini-2.5-flash-lite"}\n    assert len(candidates) <= bot.MAX_GEMINI_CANDIDATES\n\n\ndef test_execute_does_not_force_rediscovery_when_all_candidates_are_unavailable(monkeypatch):\n    bot = get_bot(monkeypatch)\n    bot.gemini_client = object()\n    monkeypatch.setattr(bot, "prioritize_models_for_task", lambda task_type="vetting": [])\n    monkeypatch.setattr(bot, "discover_available_models", lambda force_refresh=False: (_ for _ in ()).throw(AssertionError("unexpected rediscovery")))\n    try:\n        bot.execute_gemini_dynamic_request("ping")\n    except RuntimeError as exc:\n        assert "لا يوجد حالياً موديل Gemini" in str(exc)\n    else:\n        raise AssertionError("expected RuntimeError")\n\n\ndef test_daily_429_gets_long_cooldown(monkeypatch):\n    bot = get_bot(monkeypatch)\n    bot.SESSION_BLACKLIST_404.clear()\n    bot.SESSION_BLACKLIST_INCOMPATIBLE.clear()\n    bot.MODEL_COOLDOWNS_429.clear()\n    monkeypatch.setattr(bot, "prioritize_models_for_task", lambda task_type="vetting": ["daily-limited", "good-model"])\n\n    class Models:\n        def generate_content(self, model, contents, config):\n            if model == "daily-limited":\n                raise Exception("429 RESOURCE_EXHAUSTED quotaId=GenerateRequestsPerDayPerProject-FreeTier")\n            return type("Response", (), {"text": "ok"})()\n\n    client = type("Client", (), {"models": Models()})()\n    monkeypatch.setattr(bot, "gemini_client", client)\n    bot.execute_gemini_dynamic_request("ping")\n    assert bot.MODEL_COOLDOWNS_429["daily-limited"] > time.monotonic() + 5 * 60 * 60\n''')

          Path('.github/workflows/ci.yml').write_text('''name: CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    env:\n      TELEGRAM_TOKEN: test-token\n      BOT_PASSWORD: test-password\n      TWELVE_DATA_API_KEY: test-key\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \'3.11\'\n      - run: python -m pip install --upgrade pip\n      - run: python -m pip install -r requirements.txt pytest\n      - run: python -m py_compile bot.py twelve_data_gateway.py\n      - run: python -m pytest -q\n      - run: git diff --check\n''', encoding='utf-8')
          Path('.github/workflows/patch-gemini-quota.yml').unlink(missing_ok=True)
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile bot.py twelve_data_gateway.py
      - run: python -m pytest -q
      - run: git diff --check
      - name: Commit quota-aware patch
        if: "!contains(github.event.head_commit.message, '[quota-routed]') && github.head_ref == 'fix/gemini-quota-aware-routing'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py tests/test_gemini_model_routing.py .github/workflows/ci.yml .github/workflows/patch-gemini-quota.yml
          git commit -m "fix: make Gemini routing quota-aware [quota-routed]"
          git push
