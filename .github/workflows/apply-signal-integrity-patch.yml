name: Apply Signal Integrity Patch

on:
  push:
    branches:
      - fix/signal-integrity-and-session-guard

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "!contains(github.event.head_commit.message, '[auto-signal-integrity]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
        env:
          TELEGRAM_TOKEN: test-token
          BOT_PASSWORD: test-password
          TWELVE_DATA_API_KEY: test-key

      - name: Patch bot.py
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          old_config = '''    config_params = {}
    if response_mime_type:
        config_params["response_mime_type"] = response_mime_type
'''
          new_config = '''    config_params = {}
    if task_type == "vetting":
        # Binary risk-vetting must be reproducible across repeated requests.
        config_params["seed"] = int(os.getenv("GEMINI_VETTING_SEED", "17"))
        config_params["candidate_count"] = 1
    if response_mime_type:
        config_params["response_mime_type"] = response_mime_type
'''
          if old_config not in text:
              raise SystemExit('Expected Gemini config block not found')
          text = text.replace(old_config, new_config, 1)

          old_veto = '''        gemini_eval = gemini_verify_signal(candidate_signal, {'h4_trend': h4_trend, 'state_label': state})
        candidate_signal['gemini_note'] = gemini_eval.get('reason', 'تمت المراجعة بواسطة Gemini')
        candidate_signal['ai_score'] = 1.0 if gemini_eval.get('approved', True) else 0.0
        if not gemini_eval.get('approved', True) and confidence < 0.55 and max(bull_score, bear_score) < 5.0:
            return {'status': 'WAIT', 'reason': f"مراجعة Gemini أوصت بالانتظار: {gemini_eval.get('reason','مخاطرة مرتفعة')}", 'price': current_price}
'''
          new_veto = '''        gemini_eval = gemini_verify_signal(candidate_signal, {'h4_trend': h4_trend, 'state_label': state})
        approved_by_ai = bool(gemini_eval.get('approved', False))
        candidate_signal['gemini_note'] = gemini_eval.get('reason', 'لم تتم الموافقة على الإشارة')
        candidate_signal['ai_score'] = 1.0 if approved_by_ai else 0.0
        # Gemini is a hard risk gate for published signals. A rejected signal is never logged or sent.
        if not approved_by_ai:
            return {'status': 'WAIT', 'reason': f"🛑 مراجعة Gemini رفضت الإشارة: {gemini_eval.get('reason','لا توجد موافقة موثوقة')}", 'price': current_price, 'candle_id': candle_id}
'''
          if old_veto not in text:
              raise SystemExit('Expected Gemini veto block not found')
          text = text.replace(old_veto, new_veto, 1)

          marker = "if __name__ == '__main__':"
          install_block = '''# 🛡️ Final signal integrity gate: live-feed freshness + Gemini hard veto + persistent de-duplication.
from signal_safety import install_signal_safety as _install_signal_safety
_install_signal_safety()

'''
          if 'from signal_safety import install_signal_safety' not in text:
              if marker not in text:
                  raise SystemExit('bot.py main marker not found')
              text = text.replace(marker, install_block + marker, 1)

          path.write_text(text, encoding='utf-8')
          print('bot.py patched successfully')
          PY

      - name: Compile
        env:
          TELEGRAM_TOKEN: test-token
          BOT_PASSWORD: test-password
          TWELVE_DATA_API_KEY: test-key
        run: python -m py_compile bot.py sitecustomize.py signal_safety.py

      - name: Test
        env:
          TELEGRAM_TOKEN: test-token
          BOT_PASSWORD: test-password
          TWELVE_DATA_API_KEY: test-key
          GEMINI_API_KEY: ''
          CI: 'true'
        run: python -m pytest -q

      - name: Diff check
        run: git diff --check

      - name: Commit patched runtime and remove temporary patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py signal_safety.py tests/test_signal_safety.py
          git rm -f .github/workflows/apply-signal-integrity-patch.yml
          git commit -m 'fix: enforce signal integrity and live-session gating [auto-signal-integrity]'
          git push origin HEAD:${GITHUB_REF_NAME}
