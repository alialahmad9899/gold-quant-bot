name: Runtime Fix Verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run red-green repair and cleanup
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q tests/test_yahoo_host_failover.py
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old = "if status in (403, 404, 429):\n                    return None"
          new = "if status in (403, 404, 429):\n                    continue"
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          pytest -q tests/test_yahoo_host_failover.py
          rm -f tests/test_yahoo_host_failover.py .github/workflows/runtime-fix-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'fix: allow Yahoo host failover on HTTP errors'
          git push origin HEAD:main
