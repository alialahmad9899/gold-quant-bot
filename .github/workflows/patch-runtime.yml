name: Temporary runtime patch

on:
  push:
    branches: [fix/explicit-twelve-data-runtime-start]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[runtime-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply explicit Twelve Data bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = "logger = logging.getLogger('xau_quant_bot')\n"
          insert = (
              marker
              + "\n"
              + "# Explicit production bootstrap: do not rely solely on sitecustomize autostart.\n"
              + "try:\n"
              + "    import sitecustomize as _twelve_data_runtime\n"
              + "    _twelve_data_runtime.start_runtime()\n"
              + "    logger.info(\"🚀 [Twelve Data] Explicit runtime bootstrap invoked from bot.py\")\n"
              + "except Exception as _twelve_data_runtime_error:\n"
              + "    logger.exception(\"❌ [Twelve Data] Explicit runtime bootstrap failed: %s\", _twelve_data_runtime_error)\n"
          )
          if marker not in s:
              raise SystemExit('logger marker not found')
          if '_twelve_data_runtime.start_runtime()' not in s:
              s = s.replace(marker, insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n -A7 -B2 "_twelve_data_runtime.start_runtime" bot.py
      - name: Verify syntax
        run: python -m py_compile bot.py twelve_data_gateway.py
      - name: Commit patch and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/patch-runtime.yml
          git commit -m "fix: explicitly bootstrap Twelve Data runtime [runtime-patched]"
          git push
