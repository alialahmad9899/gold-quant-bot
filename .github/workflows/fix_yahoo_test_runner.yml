name: fix-yahoo-test-runner
# trigger: run after workflow installation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace numpy test dependency with stdlib fake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/yahoo_spot_hardening_apply.yml')
          text = p.read_text(encoding='utf-8')
          old = "          ns = {'np': __import__('numpy'), 'math': math, 'datetime': dt.datetime, 'timezone': dt.timezone, 'timedelta': dt.timedelta, 'PRICE_FEED_STALE_SECONDS': 90}"
          new = "          ns = {'np': type('FakeNP', (), {'isfinite': staticmethod(math.isfinite)}), 'math': math, 'datetime': dt.datetime, 'timezone': dt.timezone, 'timedelta': dt.timedelta, 'PRICE_FEED_STALE_SECONDS': 90}"
          if old not in text:
              raise RuntimeError('test dependency anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile bot.py
          git diff --check
      - name: Commit test-runner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/yahoo_spot_hardening_apply.yml
          git commit -m "test: remove numpy dependency from Yahoo feed regression"
          git push origin main
