name: Run Twelve Data hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply helper
        run: python3 tools/apply_twelve_data_hardening.py
      - name: Install and verify
        env:
          TELEGRAM_TOKEN: test-token
          BOT_PASSWORD: test-password
          TWELVE_DATA_API_KEY: test-key
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pytest
          python3 -m py_compile bot.py
          python3 -m pytest -q
          git diff --check
          if grep -RniE 'Yahoo Finance|query1\.finance\.yahoo|query2\.finance\.yahoo|yfinance' bot.py; then exit 1; fi
          if grep -n 'كلمة السر المدخلة' bot.py; then exit 1; fi
      - name: Commit verified hardening
        run: |
          rm -f tools/apply_twelve_data_hardening.py
          rm -f .github/workflows/_finalize_td_hardening.yml
          rm -f .github/workflows/_one_time_twelve_data_hardening.yml
          rm -f .github/workflows/_twelve_data_hardening_retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py requirements.txt README.md tests docs/superpowers/plans .github/workflows
          git commit -m "fix: harden Twelve Data free-tier trading path"
          git push origin main
