name: Finalize Twelve Data hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          bot = root / 'bot.py'
          text = bot.read_text(encoding='utf-8')

          # Remove any previous temporary implementation workflows after this run completes.
          # ---- Twelve Data quota state ----
          quota_pattern = r"# أزمنة تنظيم الطلبات للحفاظ المضمون على الخطة المجانية لـ Twelve Data\nTWELVE_DATA_LIVE_INTERVAL = 60\.0.*?TWELVE_DATA_LOCK = threading\.Lock\(\)\n"
          quota_replacement = '''# ميزانية Twelve Data المحافظة للخطة المجانية\nTWELVE_DATA_DAILY_BUDGET = int(os.getenv('TWELVE_DATA_DAILY_BUDGET', '650'))\nTWELVE_DATA_MINUTE_BUDGET = int(os.getenv('TWELVE_DATA_MINUTE_BUDGET', '4'))\nTWELVE_DATA_LIVE_INTERVAL = float(os.getenv('TWELVE_DATA_LIVE_INTERVAL', '180.0'))\nTWELVE_DATA_OHLC_INTERVAL = float(os.getenv('TWELVE_DATA_OHLC_INTERVAL', '60.0'))\nPRICE_FEED_EXECUTION_MAX_AGE = int(os.getenv('PRICE_FEED_EXECUTION_MAX_AGE', '300'))\nLAST_TWELVE_DATA_QUOTE_TIME = 0.0\nTWELVE_DATA_OHLC_LAST_REQUESTS = {}\nTWELVE_DATA_LOCK = threading.Lock()\nTWELVE_DATA_STATE = {\n    'day': datetime.now(timezone.utc).date().isoformat(),\n    'daily_requests': 0,\n    'minute_requests': [],\n    'blocked_until': 0.0,\n    'backoff_seconds': 0.0,\n    'daily_exhausted': False,\n    'last_error': None,\n    'last_request_at': None,\n}\n\ndef _reset_twelve_data_budget_for_tests():\n    with TWELVE_DATA_LOCK:\n        TWELVE_DATA_STATE.update({\n            'day': datetime.now(timezone.utc).date().isoformat(),\n            'daily_requests': 0, 'minute_requests': [], 'blocked_until': 0.0,\n            'backoff_seconds': 0.0, 'daily_exhausted': False,\n            'last_error': None, 'last_request_at': None,\n        })\n\ndef _refresh_twelve_data_day(now_dt=None):\n    now_dt = now_dt or datetime.now(timezone.utc)\n    day = now_dt.date().isoformat()\n    if TWELVE_DATA_STATE.get('day') != day:\n        TWELVE_DATA_STATE.update({\n            'day': day, 'daily_requests': 0, 'minute_requests': [],\n            'blocked_until': 0.0, 'backoff_seconds': 0.0,\n            'daily_exhausted': False, 'last_error': None,\n        })\n\ndef _twelve_data_request_allowed(request_kind='quote'):\n    now = time.monotonic()\n    with TWELVE_DATA_LOCK:\n        _refresh_twelve_data_day()\n        TWELVE_DATA_STATE['minute_requests'] = [ts for ts in TWELVE_DATA_STATE['minute_requests'] if now - ts < 60.0]\n        if TWELVE_DATA_STATE['daily_exhausted'] or TWELVE_DATA_STATE['daily_requests'] >= TWELVE_DATA_DAILY_BUDGET:\n            TWELVE_DATA_STATE['daily_exhausted'] = True\n            return False\n        if now < float(TWELVE_DATA_STATE.get('blocked_until', 0.0) or 0.0):\n            return False\n        return len(TWELVE_DATA_STATE['minute_requests']) < TWELVE_DATA_MINUTE_BUDGET\n\ndef _record_twelve_data_credit():\n    now = time.monotonic()\n    with TWELVE_DATA_LOCK:\n        _refresh_twelve_data_day()\n        TWELVE_DATA_STATE['daily_requests'] += 1\n        TWELVE_DATA_STATE['minute_requests'] = [ts for ts in TWELVE_DATA_STATE['minute_requests'] if now - ts < 60.0]\n        TWELVE_DATA_STATE['minute_requests'].append(now)\n        TWELVE_DATA_STATE['last_request_at'] = datetime.now(timezone.utc).isoformat()\n        if TWELVE_DATA_STATE['daily_requests'] >= TWELVE_DATA_DAILY_BUDGET:\n            TWELVE_DATA_STATE['daily_exhausted'] = True\n\ndef _record_twelve_data_success():\n    with TWELVE_DATA_LOCK:\n        TWELVE_DATA_STATE['backoff_seconds'] = 0.0\n        TWELVE_DATA_STATE['blocked_until'] = 0.0\n        TWELVE_DATA_STATE['last_error'] = None\n\ndef _record_twelve_data_failure(error_message):\n    now = time.monotonic(); message = str(error_message or '')[:300]; lowered = message.lower()\n    with TWELVE_DATA_LOCK:\n        previous = float(TWELVE_DATA_STATE.get('backoff_seconds', 0.0) or 0.0)\n        delay = 60.0 if '429' in lowered else (30.0 if '403' in lowered or '401' in lowered else 15.0)\n        delay = min(900.0, max(delay, previous * 2.0 if previous else delay))\n        TWELVE_DATA_STATE['backoff_seconds'] = delay\n        TWELVE_DATA_STATE['blocked_until'] = now + delay\n        TWELVE_DATA_STATE['last_error'] = message\n        if 'daily' in lowered or 'per day' in lowered or 'credits exhausted' in lowered:\n            TWELVE_DATA_STATE['daily_exhausted'] = True\n\ndef twelve_data_quota_summary():\n    with TWELVE_DATA_LOCK:\n        _refresh_twelve_data_day()\n        now = time.monotonic()\n        minute_count = len([ts for ts in TWELVE_DATA_STATE['minute_requests'] if now - ts < 60.0])\n        return {\n            'daily_used': int(TWELVE_DATA_STATE['daily_requests']),\n            'daily_budget': int(TWELVE_DATA_DAILY_BUDGET),\n            'minute_used': int(minute_count),\n            'minute_budget': int(TWELVE_DATA_MINUTE_BUDGET),\n            'blocked_until': float(TWELVE_DATA_STATE.get('blocked_until', 0.0) or 0.0),\n            'daily_exhausted': bool(TWELVE_DATA_STATE.get('daily_exhausted')),\n            'last_error': TWELVE_DATA_STATE.get('last_error'),\n        }\n'''
          text, n = re.subn(quota_pattern, quota_replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('quota section not found')

          live = '''def fetch_twelve_data_live_quote():\n    """جلب سعر XAU/USD المباشر من Twelve Data مع حماية الحصة وقياس صلاحية التنفيذ."""\n    global LAST_TWELVE_DATA_QUOTE_TIME\n    if not TWELVE_DATA_API_KEY:\n        return None\n    now = time.monotonic()\n    with TWELVE_DATA_LOCK:\n        if LAST_TWELVE_DATA_QUOTE_TIME and now - LAST_TWELVE_DATA_QUOTE_TIME < TWELVE_DATA_LIVE_INTERVAL:\n            return None\n    if not _twelve_data_request_allowed('quote'):\n        return None\n    _record_twelve_data_credit()\n    url = f"https://api.twelvedata.com/quote?symbol=XAU/USD&apikey={TWELVE_DATA_API_KEY}"\n    try:\n        r = requests.get(url, timeout=6)\n        data = r.json() if r.content else {}\n        if r.status_code != 200 or data.get('status') == 'error':\n            message = data.get('message') or f'HTTP {r.status_code}'\n            _record_twelve_data_failure(message)\n            logger.warning('[TWELVE_DATA] Quote failed: %s', message)\n            return None\n        price = _finite_positive(data.get('close') or data.get('price'))\n        if not price or price <= 1000:\n            _record_twelve_data_failure('Invalid XAU/USD live price.')\n            return None\n        with TWELVE_DATA_LOCK:\n            LAST_TWELVE_DATA_QUOTE_TIME = time.monotonic()\n        bid = _finite_positive(data.get('bid'))\n        ask = _finite_positive(data.get('ask'))\n        spread_available = bid is not None and ask is not None and ask >= bid\n        mid = (bid + ask) / 2.0 if spread_available else price\n        source_dt = _parse_price_feed_timestamp(data.get('datetime') or data.get('timestamp')) or datetime.now(timezone.utc)\n        now_dt = datetime.now(timezone.utc)\n        age = max(0.0, (now_dt - source_dt).total_seconds())\n        feed = {\n            'symbol': 'XAU/USD', 'provider': 'Twelve Data',\n            'status': 'ACTIVE' if age <= PRICE_FEED_STALE_SECONDS else 'STALE',\n            'bid': round(bid, 6) if bid is not None else None,\n            'ask': round(ask, 6) if ask is not None else None,\n            'mid': round(mid, 6), 'spot': round(price, 6),\n            'timestamp': source_dt.isoformat(), 'source_timestamp': source_dt.isoformat(),\n            'fetched_timestamp': now_dt.isoformat(), 'age_seconds': round(age, 3),\n            'error_type': None, 'error_message': None,\n            'spread_available': bool(spread_available),\n            'execution_ready': bool(spread_available and age <= PRICE_FEED_EXECUTION_MAX_AGE),\n        }\n        _record_twelve_data_success()\n        return feed\n    except Exception as e:\n        _record_twelve_data_failure(str(e))\n        logger.warning('[TWELVE_DATA] Exception fetching live quote: %s', e)\n        return None\n\n'''
          text, n = re.subn(r'def fetch_twelve_data_live_quote\(\):.*?(?=def fetch_twelve_data_ohlc)', live, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('live function not found')

          ohlc = '''def fetch_twelve_data_ohlc(symbol='XAU/USD', interval='15min', outputsize=150):\n    """جلب شموع OHLC التاريخية من Twelve Data مع كاش مستقل لكل إطار زمني."""\n    if not TWELVE_DATA_API_KEY:\n        return pd.DataFrame()\n    td_symbol = "XAU/USD" if "XAU" in symbol.upper() else symbol\n    td_interval = "15min" if interval in ("15m", "15min") else ("1h" if interval in ("1h", "60min") else "1day")\n    key = (td_symbol.upper(), td_interval)\n    now = time.monotonic()\n    with TWELVE_DATA_LOCK:\n        if now - float(TWELVE_DATA_OHLC_LAST_REQUESTS.get(key, 0.0) or 0.0) < TWELVE_DATA_OHLC_INTERVAL:\n            return pd.DataFrame()\n    if not _twelve_data_request_allowed('ohlc'):\n        return pd.DataFrame()\n    _record_twelve_data_credit()\n    url = f"https://api.twelvedata.com/time_series?symbol={td_symbol}&interval={td_interval}&outputsize={outputsize}&apikey={TWELVE_DATA_API_KEY}"\n    try:\n        r = requests.get(url, timeout=8)\n        data = r.json() if r.content else {}\n        with TWELVE_DATA_LOCK:\n            TWELVE_DATA_OHLC_LAST_REQUESTS[key] = time.monotonic()\n        if r.status_code != 200 or data.get('status') == 'error':\n            message = data.get('message') or f'HTTP {r.status_code}'\n            _record_twelve_data_failure(message)\n            logger.warning('[TWELVE_DATA] OHLC failed: %s', message)\n            return pd.DataFrame()\n        values = data.get('values', [])\n        if not values:\n            _record_twelve_data_failure('Twelve Data returned no OHLC values.')\n            return pd.DataFrame()\n        df = pd.DataFrame(values)\n        if 'datetime' in df.columns:\n            df['datetime'] = pd.to_datetime(df['datetime'], utc=True)\n            df = df.set_index('datetime').sort_index()\n        df = df.rename(columns={'open':'Open','high':'High','low':'Low','close':'Close','volume':'Volume'})\n        for col in ['Open','High','Low','Close']:\n            if col not in df.columns:\n                _record_twelve_data_failure(f'Missing OHLC field: {col}')\n                return pd.DataFrame()\n            df[col] = pd.to_numeric(df[col], errors='coerce')\n        if 'Volume' in df.columns:\n            df['Volume'] = pd.to_numeric(df['Volume'], errors='coerce').fillna(0.0)\n        else:\n            df['Volume'] = 0.0\n        df = df.dropna(subset=['Open','High','Low','Close'])\n        if df.empty:\n            _record_twelve_data_failure('Validated OHLC data is empty.')\n            return pd.DataFrame()\n        _record_twelve_data_success()\n        return df\n    except Exception as e:\n        _record_twelve_data_failure(str(e))\n        logger.warning('[TWELVE_DATA] Exception fetching OHLC: %s', e)\n        return pd.DataFrame()\n\n'''
          text, n = re.subn(r'def fetch_twelve_data_ohlc\(.*?(?=def fetch_canonical_xauusd_feed)', ohlc, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('ohlc function not found')

          canonical = '''def fetch_canonical_xauusd_feed():\n    """المصدر المرجعي الوحيد لـ XAU/USD: Twelve Data فقط، دون أي مزود بديل."""\n    cached = CANONICAL_XAUUSD_FEED_CACHE.get('feed')\n    if cached:\n        refreshed = _refresh_cached_feed_status(cached)\n        if refreshed.get('status') == 'ACTIVE':\n            CANONICAL_XAUUSD_FEED_CACHE['feed'] = refreshed\n            return refreshed\n    feed = fetch_twelve_data_live_quote() if TWELVE_DATA_API_KEY else None\n    if feed:\n        CANONICAL_XAUUSD_FEED_CACHE['feed'] = feed\n        return feed\n    if cached:\n        return _refresh_cached_feed_status(cached)\n    return _build_missing_twelve_feed('unavailable', 'تعذر الحصول على سعر XAU/USD المباشر من Twelve Data حالياً.')\n\n'''
          text, n = re.subn(r'def fetch_canonical_xauusd_feed\(\):.*?(?=def get_xauusd_execution_price)', canonical, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('canonical function not found')

          execution = '''def get_xauusd_execution_price(feed, direction, role):\n    direction = str(direction).upper(); role = str(role).upper()\n    if not feed or feed.get('status') != 'ACTIVE' or not feed.get('execution_ready'):\n        return None\n    if feed.get('age_seconds') is None or float(feed.get('age_seconds')) > PRICE_FEED_EXECUTION_MAX_AGE:\n        return None\n    if role == 'ENTRY':\n        return feed.get('ask') if direction == 'BUY' else feed.get('bid')\n    if role == 'EXIT':\n        return feed.get('bid') if direction == 'BUY' else feed.get('ask')\n    return feed.get('mid') or feed.get('spot')\n\n'''
          text, n = re.subn(r'def get_xauusd_execution_price\(.*?(?=def fetch_live_spot_gold)', execution, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('execution function not found')

          interval = '''def _historical_interval_needs_refresh(df, interval):\n    if df is None or df.empty or not isinstance(df.index, pd.DatetimeIndex):\n        return True\n    now = pd.Timestamp(datetime.now(timezone.utc))\n    if interval == '15min':\n        last_completed = now.floor('15min') - pd.Timedelta(minutes=15)\n    elif interval == '1h':\n        last_completed = now.floor('1h') - pd.Timedelta(hours=1)\n    else:\n        last_completed = now.floor('1D') - pd.Timedelta(days=1)\n    latest = pd.Timestamp(df.index[-1])\n    latest = latest.tz_localize('UTC') if latest.tzinfo is None else latest.tz_convert('UTC')\n    return latest < last_completed\n\ndef get_chart_data_cached():\n    with cache_lock:\n        current = MARKET_DATA_CACHE.copy()\n    needs_h1 = _historical_interval_needs_refresh(current['df_gold_h1'], '1h')\n    needs_m15 = _historical_interval_needs_refresh(current['df_gold_m15'], '15min')\n    if not (needs_h1 or needs_m15):\n        return current\n    with fetch_lock:\n        with cache_lock:\n            current = MARKET_DATA_CACHE.copy()\n        needs_h1 = _historical_interval_needs_refresh(current['df_gold_h1'], '1h')\n        needs_m15 = _historical_interval_needs_refresh(current['df_gold_m15'], '15min')\n        if needs_h1:\n            df_h1 = fetch_twelve_data_ohlc('XAU/USD', interval='1h', outputsize=150)\n            if not df_h1.empty:\n                with cache_lock: MARKET_DATA_CACHE['df_gold_h1'] = df_h1\n        if needs_m15:\n            df_m15 = fetch_twelve_data_ohlc('XAU/USD', interval='15min', outputsize=150)\n            if not df_m15.empty:\n                with cache_lock: MARKET_DATA_CACHE['df_gold_m15'] = df_m15\n        with cache_lock:\n            MARKET_DATA_CACHE['last_fetch'] = datetime.now(timezone.utc)\n            return MARKET_DATA_CACHE.copy()\n\n'''
          text, n = re.subn(r'def get_chart_data_cached\(\):.*?(?=def get_verified_closed_m15)', interval, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('chart cache function not found')

          validation = '''def validate_trade_levels(signal_type, entry, sl, tp1, tp2):\n    direction = _trade_direction(signal_type)\n    try:\n        entry_f, sl_f, tp1_f, tp2_f = [float(v) for v in (entry, sl, tp1, tp2)]\n    except (TypeError, ValueError):\n        return False, 'مستويات الدخول ووقف الخسارة والأهداف يجب أن تكون أرقاماً صالحة.'\n    if not all(np.isfinite(v) and v > 0 for v in (entry_f, sl_f, tp1_f, tp2_f)):\n        return False, 'مستويات الدخول ووقف الخسارة والأهداف يجب أن تكون أسعاراً موجبة وصالحة.'\n    valid = (sl_f < entry_f < tp1_f < tp2_f) if direction == 'BUY' else ((tp2_f < tp1_f < entry_f < sl_f) if direction == 'SELL' else False)\n    return (True, 'سليم') if valid else (False, 'ترتيب مستويات الدخول ووقف الخسارة والأهداف غير صالح لاتجاه الصفقة.')\n\n'''
          text, n = re.subn(r'def validate_trade_levels\(.*?(?=def _calculate_realized_r)', validation, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('validation function not found')

          news = '''def fetch_live_economic_news_alert():\n    # لا يوجد مصدر أخبار مباشر ضمن المزود الوحيد المسموح به حالياً؛ لا ندعي أن الظروف الإخبارية مستقرة.\n    return False, 'التحقق الإخباري المباشر غير متاح حالياً.', True\n\n'''
          text, n = re.subn(r'def fetch_live_economic_news_alert\(\):.*?(?=def clean_df_columns)', news, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('news function not found')
          text = text.replace("    if fetch_failed:\n        return True, f\"وضع مراقبة مخفّض: تعذر التحقق من الأخبار اللحظية ({news_title}).\"\n", "    if fetch_failed:\n        return False, f\"تم حظر الإشارة مؤقتاً لأن التحقق الإخباري المباشر غير متاح ({news_title})\"\n", 1)

          # Replace only the complete Telegram price handler; all user-facing text remains Arabic.
          price_func = '''async def price(update: Update, context: ContextTypes.DEFAULT_TYPE):\n    chat_id = update.effective_chat.id\n    if not is_authenticated(chat_id):\n        await safe_reply_text(update, "🔒 يرجى إدخال كلمة السر أولاً لاستخدام البوت.")\n        return\n    data = get_market_data(); feed = data.get('price_feed') or {}\n    def fmt(value): return f"{float(value):.2f}" if value is not None else "غير متاح"\n    age = f"{float(feed['age_seconds']):.1f} ثانية" if feed.get('age_seconds') is not None else "غير متاح"\n    status_map = {'ACTIVE': 'نشط', 'STALE': 'قديم', 'MISSING': 'غير متاح'}\n    quota = twelve_data_quota_summary()\n    msg = (\n        "📊 **سعر الذهب XAU/USD المباشر**\\n"\n        "───────────────────\\n"\n        "📡 **المزود:** Twelve Data\\n"\n        f"📍 **الحالة:** {status_map.get(feed.get('status'), feed.get('status', 'غير متاح'))}\\n"\n        f"🟢 **Bid:** {fmt(feed.get('bid'))}\\n"\n        f"🔴 **Ask:** {fmt(feed.get('ask'))}\\n"\n        f"💰 **السعر المتوسط:** {fmt(feed.get('mid'))}\\n"\n        f"🕒 **وقت المصدر:** {feed.get('timestamp') or 'غير متاح'}\\n"\n        f"⏱️ **عمر البيانات:** {age}\\n"\n        f"🎯 **جاهزية التنفيذ:** {'نعم' if feed.get('execution_ready') else 'لا'}\\n"\n        f"📦 **استهلاك الحصة اليومي:** {quota['daily_used']}/{quota['daily_budget']}\\n"\n        f"⚡ **استهلاك الدقيقة:** {quota['minute_used']}/{quota['minute_budget']}\\n"\n        f"💡 **الملاحظة:** {feed.get('error_message') or 'البيانات تعمل ضمن القيود الحالية.'}"\n    )\n    await safe_reply_text(update, msg, reply_markup=get_main_keyboard(), parse_mode='Markdown')\n\n'''
          text, n = re.subn(r'async def price\(update: Update, context: ContextTypes.DEFAULT_TYPE\):.*?(?=async def analyze\()', price_func, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('price function not found')

          # Do not ever relay the user's password to the administrator.
          text = re.sub(r'await notify_admin\(context, f"⚠️ \*\*محاولة دخول فاشلة!\*\*\\nالمستخدم: \{user_info\}\\nكلمة السر المدخلة: `\{text\}`"\)', 'await notify_admin(context, f"⚠️ **محاولة دخول فاشلة!**\\nالمستخدم: {user_info}\\nتنبيه: تم رفض محاولة الدخول دون تسجيل كلمة السر.")', text, count=1)

          bot.write_text(text, encoding='utf-8')

          req = root / 'requirements.txt'; req_text = req.read_text(encoding='utf-8')\n          if 'scikit-learn' not in req_text: req_text += 'scikit-learn\\n'\n          req.write_text(req_text, encoding='utf-8')

          (root / 'README.md').write_text('''# Gold Quant Bot\n\nبوت تداول كمي للذهب XAU/USD عبر Telegram، يجمع التحليل الفني/الكمي وSMC/HMM/ML وGemini وإدارة دورة حياة الصفقة.\n\n## مصدر البيانات\n\nTwelve Data هو المصدر الوحيد لبيانات XAU/USD في مسار الإنتاج. لا يستخدم البوت Yahoo Finance أو مزود سوق آخر. بيانات M15/H1 التاريخية تستخدم للتحليل من الكاش، بينما إنشاء صفقة جديدة يتطلب Live Quote حديثاً وصالحاً من Twelve Data مع Bid/Ask صالحين. لا يتم تحويل إغلاق شمعة M15 إلى سعر تنفيذ لحظي.\n\n## حماية الخطة المجانية\n\nيعمل النظام بميزانية داخلية محافظة للطلبات، وحد للدقيقة واليوم، وتراجع تلقائي بعد أخطاء API، وإيقاف آمن للتداول عند عدم توفر Live Quote أو استنفاد الحصة.\n\n## رسائل Telegram\n\nجميع الرسائل التي يراها المستخدم في Telegram باللغة العربية. المصطلحات التقنية وأسماء APIs قد تظهر كما هي عند الحاجة.\n\n## التشغيل\n\nاضبط `TELEGRAM_TOKEN` و`BOT_PASSWORD` و`TWELVE_DATA_API_KEY`، و`DATABASE_URL` عند استخدام PostgreSQL، و`GEMINI_API_KEY` عند تفعيل Gemini. ثم ثبّت `requirements.txt` وشغّل `python bot.py`.\n\n## التحقق\n\n`python3 -m py_compile bot.py`\n\n`python3 -m pytest -q`\n''', encoding='utf-8')

          tests = root / 'tests'; tests.mkdir(exist_ok=True)
          test_files = {
          'test_twelve_data_guardrails.py': '''import importlib.util, os\nfrom pathlib import Path\nos.environ.setdefault("TELEGRAM_TOKEN","test-token"); os.environ.setdefault("BOT_PASSWORD","test-password"); os.environ.setdefault("TWELVE_DATA_API_KEY","test-key")\nspec=importlib.util.spec_from_file_location("bot_guard",Path(__file__).resolve().parents[1]/"bot.py"); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)\ndef test_budget_is_conservative(): assert 0<m.TWELVE_DATA_DAILY_BUDGET<800 and 0<m.TWELVE_DATA_MINUTE_BUDGET<8\ndef test_daily_budget_blocks(monkeypatch):\n m._reset_twelve_data_budget_for_tests(); monkeypatch.setattr(m,"TWELVE_DATA_DAILY_BUDGET",2); m._record_twelve_data_credit(); m._record_twelve_data_credit(); assert not m._twelve_data_request_allowed(); assert m.TWELVE_DATA_STATE["daily_exhausted"]\ndef test_failure_backoff(monkeypatch):\n m._reset_twelve_data_budget_for_tests(); monkeypatch.setattr(m.time,"monotonic",lambda:1000.0); m._record_twelve_data_failure("429 Too Many Requests"); assert m.TWELVE_DATA_STATE["blocked_until"]>1000.0\n''',
          'test_market_feed_semantics.py': '''import importlib.util, os\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nos.environ.setdefault("TELEGRAM_TOKEN","test-token"); os.environ.setdefault("BOT_PASSWORD","test-password"); os.environ.setdefault("TWELVE_DATA_API_KEY","test-key")\nspec=importlib.util.spec_from_file_location("bot_feed",Path(__file__).resolve().parents[1]/"bot.py"); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)\ndef test_m15_close_cannot_be_live(monkeypatch):\n m.CANONICAL_XAUUSD_FEED_CACHE['feed']=None; m.MARKET_DATA_CACHE['df_gold_m15']=m.pd.DataFrame({'Close':[3300.0]},index=[datetime.now(timezone.utc)-timedelta(minutes=5)]); monkeypatch.setattr(m,'fetch_twelve_data_live_quote',lambda:None); feed=m.fetch_canonical_xauusd_feed(); assert feed['status']=='MISSING'; assert not feed.get('execution_ready',False)\ndef test_stale_quote_not_execution_ready():\n feed={'status':'ACTIVE','execution_ready':True,'bid':3299.0,'ask':3301.0,'mid':3300.0,'timestamp':(datetime.now(timezone.utc)-timedelta(minutes=10)).isoformat()}; r=m._refresh_cached_feed_status(feed); assert r['status']=='STALE'\n''',
          'test_market_cache_refresh.py': '''import importlib.util, os\nfrom datetime import datetime, timezone, timedelta\nfrom pathlib import Path\nos.environ.setdefault("TELEGRAM_TOKEN","test-token"); os.environ.setdefault("BOT_PASSWORD","test-password"); os.environ.setdefault("TWELVE_DATA_API_KEY","test-key")\nspec=importlib.util.spec_from_file_location("bot_cache",Path(__file__).resolve().parents[1]/"bot.py"); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)\ndef test_old_m15_cache_needs_refresh():\n df=m.pd.DataFrame({'Close':[3300.0]},index=[datetime.now(timezone.utc)-timedelta(hours=1)]); assert m._historical_interval_needs_refresh(df,'15min')\n''',
          'test_signal_execution_guard.py': '''import importlib.util, os\nfrom pathlib import Path\nos.environ.setdefault("TELEGRAM_TOKEN","test-token"); os.environ.setdefault("BOT_PASSWORD","test-password"); os.environ.setdefault("TWELVE_DATA_API_KEY","test-key")\nspec=importlib.util.spec_from_file_location("bot_signal",Path(__file__).resolve().parents[1]/"bot.py"); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)\ndef test_execution_requires_real_bid_ask():\n feed={'status':'ACTIVE','execution_ready':False,'bid':None,'ask':None,'mid':3300.0}; assert m.get_xauusd_execution_price(feed,'BUY','ENTRY') is None; assert m.get_xauusd_execution_price(feed,'SELL','ENTRY') is None\n''',
          'test_project_hygiene.py': '''from pathlib import Path\ndef test_requirements_have_sklearn(): assert 'scikit-learn' in Path('requirements.txt').read_text(encoding='utf-8')\ndef test_readme_is_twelve_data_only():\n t=Path('README.md').read_text(encoding='utf-8'); assert 'Twelve Data هو المصدر الوحيد' in t; assert 'Yahoo Finance هو المصدر الأساسي' not in t\ndef test_price_message_is_arabic():\n t=Path('bot.py').read_text(encoding='utf-8'); assert 'Provider: Twelve Data' not in t; assert 'XAU/USD Live Price Feed' not in t\n'''
          }
          for name, content in test_files.items():
              (tests/name).write_text(content, encoding='utf-8')

          # Remove all temporary one-time workflows after successful patching.
          for p in root.glob('.github/workflows/_*twelve_data*.yml'):
              p.unlink()
          PY

      - name: Verify
        env:
          TELEGRAM_TOKEN: test-token
          BOT_PASSWORD: test-password
          TWELVE_DATA_API_KEY: test-key
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pytest
          python3 -m py_compile bot.py
          python3 -m pytest -q
          git diff --check
          if grep -RniE 'Yahoo Finance|query1\.finance\.yahoo|query2\.finance\.yahoo|yfinance' bot.py; then exit 1; fi
          if grep -n 'كلمة السر المدخلة' bot.py; then exit 1; fi

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py requirements.txt README.md tests docs/superpowers/plans .github/workflows
          git commit -m "fix: harden Twelve Data free-tier trading path"
          git push origin main
