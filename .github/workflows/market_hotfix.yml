name: market-hotfix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        run: |
          python3 -m py_compile bot.py
          echo RUNNER_OK
