name: Temporary Gemini routing refinement

on:
  push:
    branches: [fix/gemini-model-routing]

permissions:
  contents: write

jobs:
  refine:
    if: "!contains(github.event.head_commit.message, '[gemini-refined]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine cooldown and 400 classification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          old_pool = '''    pool_models = active_candidates if active_candidates else [\n        m for m in available\n        if is_compatible_generate_content_model(m)\n        and m not in SESSION_BLACKLIST_404\n        and m not in SESSION_BLACKLIST_INCOMPATIBLE\n    ]\n'''
          new_pool = '''    pool_models = active_candidates\n'''
          if old_pool not in s:
              raise SystemExit('pool fallback block not found')
          s = s.replace(old_pool, new_pool, 1)

          old_400 = '''            if ("This model only supports Interactions API" in err_str\n                    or "Interactions API" in err_str\n                    or "INVALID_ARGUMENT" in err_str):\n'''
          new_400 = '''            if ("This model only supports Interactions API" in err_str\n                    or "Interactions API" in err_str):\n'''
          if old_400 not in s:
              raise SystemExit('400 classification block not found')
          s = s.replace(old_400, new_400, 1)

          old_empty = '''    if not candidates:\n        candidates = discover_available_models(force_refresh=True)[:MAX_GEMINI_CANDIDATES]\n        if not candidates:\n            raise RuntimeError("لم يتم العثور على أي موديل متوافق فعلياً مع generate_content.")\n'''
          new_empty = '''    if not candidates:\n        candidates = [\n            m for m in discover_available_models(force_refresh=True)\n            if m not in SESSION_BLACKLIST_404\n            and m not in SESSION_BLACKLIST_INCOMPATIBLE\n            and time.monotonic() >= MODEL_COOLDOWNS_429.get(m, 0)\n        ][:MAX_GEMINI_CANDIDATES]\n        if not candidates:\n            raise RuntimeError("لا يوجد حالياً موديل Gemini متوافق ومتاح للخدمة؛ تم احترام cooldowns والقيود المؤقتة.")\n'''
          if old_empty not in s:
              raise SystemExit('empty candidate block not found')
          s = s.replace(old_empty, new_empty, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile bot.py twelve_data_gateway.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm .github/workflows/refine-gemini-routing.yml
          git commit -m "fix: refine Gemini cooldown routing [gemini-refined]"
          git push
