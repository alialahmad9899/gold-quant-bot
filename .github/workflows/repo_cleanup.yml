name: repository-cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair and organize repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          bot = Path('bot.py')
          text = bot.read_text(encoding='utf-8')
          fixes = [
              ('outcome = 0 if abs(f_open - sl) < abs(open_val - tp) else 1',
               'outcome = 0 if abs(f_open - sl) < abs(f_open - tp) else 1'),
              ('cursor.execute("SELECT COUNT(*) FROM trades WHERE outcome IS NOT NULL")\n        pending_trades = cursor.fetchone()[0] or 0',
               'cursor.execute("SELECT COUNT(*) FROM trades WHERE outcome IS NULL AND trade_status IN (\'OPEN\', \'TP1_HIT\')")\n        pending_trades = cursor.fetchone()[0] or 0'),
              ('"provider":"legacy provider"', '"provider":"Yahoo Finance"'),
              ('return False, "الظروف الإخبارية مستقرة", False', 'return False, "مصدر الأخبار اللحظية غير مفعّل في هذه النسخة.", True'),
              ('"market_data": {"gold": 0.0, "dxy": 99.85, "us10y": 4.63}', '"market_data": {"gold": 0.0, "dxy": None, "us10y": None}'),
          ]
          for old, new in fixes:
              if old not in text:
                  raise RuntimeError('missing repair anchor: ' + old[:80])
              text = text.replace(old, new, 1)

          old = '''def get_market_data():
    feed = fetch_canonical_xauusd_feed()
    spot = feed.get('mid') if feed.get('status') == 'ACTIVE' else 0.0
    return {
        'gold': round(float(spot), 2) if spot else 0.0,
        'dxy': 99.85,
        'us10y': 4.63,
        'price_feed': feed,
    }
'''
          new = '''def get_market_data():
    feed = fetch_canonical_xauusd_feed()
    spot = feed.get('mid') if feed.get('status') == 'ACTIVE' else 0.0
    with cache_lock:
        snapshot = GLOBAL_CACHE.get('market_data') or {}
    return {
        'gold': round(float(spot), 2) if spot else 0.0,
        'dxy': snapshot.get('dxy'),
        'us10y': snapshot.get('us10y'),
        'price_feed': feed,
    }
'''
          if old not in text:
              raise RuntimeError('get_market_data anchor missing')
          text = text.replace(old, new, 1)

          old = """                if not df_us10y_m15.empty: MARKET_DATA_CACHE['df_us10y_m15'] = df_us10y_m15
                if not df_gold_h1.empty or not df_gold_m15.empty:
                    MARKET_DATA_CACHE['last_fetch'] = now
"""
          new = """                if not df_us10y_m15.empty: MARKET_DATA_CACHE['df_us10y_m15'] = df_us10y_m15
                previous = GLOBAL_CACHE.get('market_data') or {}
                dxy_value = previous.get('dxy')
                us10y_value = previous.get('us10y')
                if not df_dxy_m15.empty:
                    dxy_value = float(to_1d_series(df_dxy_m15['Close']).iloc[-1])
                if not df_us10y_m15.empty:
                    us10y_value = float(to_1d_series(df_us10y_m15['Close']).iloc[-1])
                GLOBAL_CACHE['market_data']['dxy'] = dxy_value
                GLOBAL_CACHE['market_data']['us10y'] = us10y_value
                if not df_gold_h1.empty or not df_gold_m15.empty:
                    MARKET_DATA_CACHE['last_fetch'] = now
"""
          if old not in text:
              raise RuntimeError('historical cache anchor missing')
          text = text.replace(old, new, 1)
          bot.write_text(text, encoding='utf-8')

          for p in Path('.').rglob('__pycache__'):
              if p.is_dir():
                  shutil.rmtree(p)
          for p in Path('.').rglob('*.pyc'):
              if p.is_file():
                  p.unlink()
          marker = Path('.github/YAHOO_HARDENING_TRIGGER.txt')
          if marker.exists():
              marker.unlink()

          Path('.gitignore').write_text('''__pycache__/
*.py[cod]
*.pyo
.pytest_cache/
.mypy_cache/
.ruff_cache/
trades.db
*.sqlite
*.sqlite3
*.db-wal
*.db-shm
*.log
.env
.env.*
!.env.example
''', encoding='utf-8')
          Path('README.md').write_text('''# Gold Quant Bot

Quantitative XAU/USD trading bot for Telegram with market analysis, trade lifecycle management, ML evaluation, and optional Gemini review.

## Market data

Yahoo Finance is the canonical provider: `XAUUSD=X` for live Spot and gold M15/H1, `DX-Y.NYB` for DXY, and `^TNX` for US 10Y yield. No production price fallback uses futures, crypto, scraping, or ArgentAPI.

## Runtime

Required: `TELEGRAM_TOKEN`, `BOT_PASSWORD`. Optional: `DATABASE_URL` for PostgreSQL and `GEMINI_API_KEY` for Gemini.

## Checks

`python3 -m py_compile bot.py`

`python3 tests/test_market_provider_hygiene.py`

`python3 tests/test_repo_regressions.py`
''', encoding='utf-8')
          Path('tests/test_repo_regressions.py').write_text('''from pathlib import Path
text = Path("bot.py").read_text(encoding="utf-8")
assert "open_val" not in text
assert "WHERE outcome IS NULL AND trade_status IN ('OPEN','TP1_HIT')" in text
assert '"provider":"legacy provider"' not in text
assert '"provider":"Yahoo Finance"' in text
assert 'الظروف الإخبارية مستقرة' not in text
assert 'dxy": 99.85' not in text
assert 'us10y": 4.63' not in text
print("REPO_REGRESSIONS_OK")
''', encoding='utf-8')
          PY

          python3 -m py_compile bot.py
          python3 tests/test_market_provider_hygiene.py
          python3 tests/test_repo_regressions.py
          git diff --check

      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repo_cleanup.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: clean repository and fix runtime regressions"
          git push origin main
